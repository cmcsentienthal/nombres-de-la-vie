<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Géomancie — la science du sable</title>
<style>
:root{
 --bg:#FFF8E6; --bg2:#FFF1CC; --txt:#1E2340; --txt2:#3C4370; --carte:#FFFFFF; --bord:#F4D58D;
 --jaune:#FFD23F; --orange:#FF8A3D; --rouge:#FF4D5E; --vert:#2ECC71; --vert2:#7BE495;
 --g1:linear-gradient(135deg,#FFD23F 0%,#FF8A3D 55%,#FF4D5E 100%);
 --g2:linear-gradient(135deg,#7BE495 0%,#2ECC71 45%,#FFD23F 100%);
 --g3:linear-gradient(135deg,#FF8A3D 0%,#FF4D5E 60%,#FF7AA8 100%);
 --g4:linear-gradient(135deg,#FFE066 0%,#7BE495 100%);
 --bandeau:linear-gradient(90deg,#FFD23F,#FF8A3D,#FF4D5E,#FF8A3D,#2ECC71);
 --point:#1E2340; --ombre:0 4px 14px rgba(255,138,61,.25);
 --lien:#C2185B;
}
body.nuit{
 --bg:#0B1D4A; --bg2:#13306E; --txt:#EAF2FF; --txt2:#B9CCF5; --carte:rgba(20,45,105,.82); --bord:#3E63B8;
 --g1:linear-gradient(135deg,#2B59C3 0%,#3F7BEA 55%,#E2435C 100%);
 --g2:linear-gradient(135deg,#1F4FA8 0%,#2E8BC0 60%,#41C08B 100%);
 --g3:linear-gradient(135deg,#3F7BEA 0%,#6A5AE0 60%,#E2435C 100%);
 --g4:linear-gradient(135deg,#1E3F8F 0%,#2E8BC0 100%);
 --bandeau:linear-gradient(90deg,#1E3F8F,#3F7BEA,#E2435C,#3F7BEA,#1E3F8F);
 --point:#FFFFFF; --ombre:0 4px 16px rgba(0,0,0,.35); --lien:#FF8FA3;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;line-height:1.55;min-height:100vh;transition:background .4s}
#ciel{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
body.nuit #ciel{display:block}
header,main,nav{position:relative;z-index:1}
header{background:var(--bandeau);padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;box-shadow:var(--ombre)}
header h1{margin:0;font-size:1.45rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.25);letter-spacing:.5px}
header small{display:block;font-size:.72rem;color:#fff;opacity:.95}
#modeBtn{background:rgba(255,255,255,.9);border:0;border-radius:50px;padding:.45rem .9rem;font-size:1rem;cursor:pointer;color:#1E2340;font-weight:600}
nav{display:flex;overflow-x:auto;gap:.4rem;padding:.6rem .6rem;background:var(--bg2);position:sticky;top:0;z-index:5;scrollbar-width:thin}
nav button{flex:0 0 auto;border:0;border-radius:14px;padding:.55rem .85rem;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--carte);color:var(--txt);border:2px solid var(--bord)}
nav button.actif{background:var(--g1);color:#fff;border-color:transparent;box-shadow:var(--ombre)}
main{max-width:1100px;margin:0 auto;padding:1rem}
section.onglet{display:none;animation:apparait .35s ease}
section.onglet.actif{display:block}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:1.5rem;margin:.2rem 0 .8rem;background:linear-gradient(90deg,#FF6A2B,#FF3D57,#E0457B);-webkit-background-clip:text;background-clip:text;color:transparent}
body.nuit h2{background:none;color:#9CC3FF}
h3{font-size:1.2rem;margin:1.4rem 0 .5rem;color:var(--txt);border-left:6px solid var(--orange);padding-left:.6rem}
body.nuit h3{border-left-color:#E2435C}
h4{margin:1rem 0 .4rem}
.carte{background:var(--carte);border:2px solid var(--bord);border-radius:18px;padding:1rem;margin:.8rem 0;box-shadow:var(--ombre)}
.src{font-size:.82rem;color:var(--txt2);font-style:italic;border-top:1px dashed var(--bord);padding-top:.3rem;margin-top:.6rem}
.note{background:var(--g4);color:#1E2340;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0;font-size:.92rem}
body.nuit .note{color:#fff}
.alerte{background:var(--g3);color:#fff;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0;font-weight:600}
.ok{background:var(--g2);color:#10301E;border-radius:12px;padding:.5rem .8rem;margin:.4rem 0;font-weight:600}
body.nuit .ok{color:#fff}
.btn{border:0;border-radius:14px;padding:.65rem 1.1rem;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:var(--g1);box-shadow:var(--ombre);margin:.25rem .25rem .25rem 0;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.vert{background:var(--g2);color:#10301E}
body.nuit .btn.vert{color:#fff}
.btn.rose{background:var(--g3)}
.btn.discret{background:var(--carte);color:var(--txt);border:2px solid var(--bord);box-shadow:none}
input,select,textarea{font-size:1rem;padding:.55rem .7rem;border-radius:12px;border:2px solid var(--bord);background:var(--carte);color:var(--txt);width:100%;font-family:inherit}
label{font-weight:600;display:block;margin:.6rem 0 .25rem}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:640px){.ligne2{grid-template-columns:1fr}}
/* figures */
.fig{display:inline-grid;grid-template-rows:repeat(4,1fr);gap:4px;padding:4px}
.fig .r{display:flex;justify-content:center;gap:10px;height:12px}
.fig .p{width:12px;height:12px;border-radius:50%;background:var(--point)}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.tuile{border-radius:18px;padding:.8rem .5rem;text-align:center;cursor:pointer;color:#fff;box-shadow:var(--ombre);transition:transform .2s;border:0;font-size:1rem}
.tuile:hover{transform:translateY(-3px) rotate(-.5deg)}
.tuile .fig .p{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tuile b{display:block;font-size:1.02rem;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.tuile span{font-size:.82rem;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.t0{background:linear-gradient(135deg,#FFD23F,#FF8A3D)}.t1{background:linear-gradient(135deg,#FF8A3D,#FF4D5E)}
.t2{background:linear-gradient(135deg,#2ECC71,#FFD23F)}.t3{background:linear-gradient(135deg,#FF4D5E,#FF8A3D)}
body.nuit .t0{background:linear-gradient(135deg,#2B59C3,#3F7BEA)}body.nuit .t1{background:linear-gradient(135deg,#3F7BEA,#E2435C)}
body.nuit .t2{background:linear-gradient(135deg,#1F4FA8,#2E8BC0)}body.nuit .t3{background:linear-gradient(135deg,#6A5AE0,#2B59C3)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--bord);padding:.45rem .5rem;vertical-align:top;text-align:left}
th{background:var(--g1);color:#fff}
.tabwrap{overflow-x:auto}
details{background:var(--carte);border:2px solid var(--bord);border-radius:14px;margin:.5rem 0;padding:.4rem .8rem}
summary{cursor:pointer;font-weight:700;padding:.3rem 0}
.en{font-family:Georgia,"Times New Roman",serif;font-size:.92rem;color:var(--txt2);border-left:4px solid var(--vert);padding-left:.6rem;margin:.4rem 0;white-space:pre-line}
.fichehaut{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;border-radius:18px;padding:1rem;color:#fff;background:var(--g1);box-shadow:var(--ombre)}
.fichehaut .fig .p{background:#fff;width:18px;height:18px}.fichehaut .fig .r{height:18px;gap:16px}
.fichehaut h3{color:#fff;border:0;margin:0;padding:0;font-size:1.4rem}
/* écu */
.ecuwrap{overflow-x:auto;padding-bottom:.3rem}
.ecu{display:grid;gap:.4rem;margin:.6rem 0}
.ecu .rang{display:grid;gap:.4rem}
.case{border-radius:14px;padding:.35rem .2rem;text-align:center;background:var(--carte);border:2px solid var(--bord);min-height:96px;opacity:.18;transition:opacity .5s,transform .5s;font-size:.78rem}
.case.vue{opacity:1}
.case.neuf{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.case .num{font-weight:800;font-size:.85rem;color:var(--orange)}
body.nuit .case .num{color:#FF8FA3}
.case .nm{font-weight:700;line-height:1.15}
.case .fig .p{width:9px;height:9px}.case .fig .r{height:9px;gap:7px}
.case.mq{border-color:var(--rouge);box-shadow:0 0 0 3px rgba(255,77,94,.35)}
/* tirage */
.lignes16{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.lg{border:2px solid var(--bord);border-radius:12px;padding:.3rem .4rem;font-size:.82rem;background:var(--carte)}
.lg.cour{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,61,.35)}
.zone{min-height:110px;border:3px dashed var(--orange);border-radius:16px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:.6rem;cursor:pointer;user-select:none;background:var(--bg2);direction:rtl}
.trait{width:5px;height:46px;background:var(--txt);border-radius:3px;transition:opacity .3s,transform .3s}
.trait.barre{opacity:.15;transform:scaleY(.6)}
.points{display:flex;flex-wrap:wrap;gap:4px;direction:rtl}
.points i{width:9px;height:9px;border-radius:50%;background:var(--txt);display:inline-block}
.points i.barre{opacity:.15}
.choix{display:flex;flex-wrap:wrap;gap:.4rem}
.modal{position:fixed;inset:0;background:rgba(10,20,50,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:1rem}
.modal.ouvert{display:flex}
.modal .boite{background:var(--bg);border-radius:20px;max-width:900px;width:100%;padding:1rem;box-shadow:0 10px 40px rgba(0,0,0,.4);position:relative}
.fermer{position:sticky;top:.2rem;display:block;margin:0 0 .6rem auto;z-index:2}
.flip{perspective:900px;max-width:420px;margin:1rem auto}
.flip .in{position:relative;min-height:300px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip.retourne .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:var(--ombre);text-align:center}
.flip .face.av{background:var(--g1)}.flip .face.ar{background:var(--g2);transform:rotateY(180deg);color:#10301E}
body.nuit .flip .face.ar{color:#fff}
.flip .face .fig .p{background:#fff;width:22px;height:22px}.flip .face .fig .r{height:22px;gap:20px}
.qopt{display:block;width:100%;text-align:left;margin:.35rem 0}
.badge{display:inline-block;border-radius:20px;padding:.1rem .6rem;font-size:.8rem;font-weight:700;background:var(--g2);color:#10301E;margin:.1rem}
.badge.r{background:var(--g3);color:#fff}
.badge.j{background:linear-gradient(90deg,#FFD23F,#FF8A3D);color:#1E2340}
a{color:var(--lien)}
.petit{font-size:.85rem;color:var(--txt2)}
.flexb{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.cadeau{display:flex;flex-direction:column;align-items:center;gap:10px}
.cadeau a{display:inline-block;line-height:0;border-radius:4px}
.cadeau img{width:88px;height:31px}
.cadeau p{margin:0;font-family:Georgia,"Noto Serif",serif;font-weight:800;font-size:18px;color:#D9480F;background:linear-gradient(120deg,#FFD21F 0%,#FF9A1F 38%,#F0433A 72%,#E8306B 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cadeau a.asso{display:inline;line-height:inherit;border-radius:0;text-decoration:underline;text-decoration-color:#F0433A;text-underline-offset:3px;text-decoration-thickness:2px}
footer{text-align:center;padding:2rem 1rem;font-size:.85rem;color:var(--txt2);position:relative;z-index:1}

@media(max-width:640px){
 html{font-size:17px}
 .ecu{gap:.25rem}.ecu .rang{gap:.25rem}
 .case{padding:.2rem .05rem;min-height:70px;font-size:.6rem;border-radius:10px;border-width:1.5px}
 .case .num{font-size:.68rem}
 .case .fig{padding:2px;gap:2px}.case .fig .p{width:6px;height:6px}.case .fig .r{height:6px;gap:4px}
 .case .nm{font-size:.6rem;word-break:break-word}
 .lignes16{grid-template-columns:repeat(2,1fr)}
 header h1{font-size:1.25rem}
}
.ecu .rang > *{min-width:0}
.case .nm,.case > div:last-child{overflow-wrap:anywhere}

</style>
</head>
<body>
<canvas id="ciel"></canvas>
<header><div><h1>Géomancie</h1><small>la science du sable · Europe et Afrique de l’Ouest</small></div><button id="modeBtn">🌙 Nuit</button></header>
<nav></nav>
<main>
<section class="onglet" id="tirage"></section>
<section class="onglet" id="theme"></section>
<section class="onglet" id="lecture"></section>
<section class="onglet" id="figures"></section>
<section class="onglet" id="maisons"></section>
<section class="onglet" id="variantes"></section>
<section class="onglet" id="theorie"></section>
<section class="onglet" id="histoire"></section>
<section class="onglet" id="afrique"></section>
<section class="onglet" id="journal"></section>
<section class="onglet" id="apprendre"></section>
<section class="onglet" id="sources"></section>
</main>

// Données générées — ne pas modifier à la main
const FIG=[{"n": 1, "rows": [1, 1, 2, 1], "zen": "Al Kousadji", "zenMaison": "Ioussoufou — maison du demandeur", "elem": "feu et est", "zod": "Gémeaux ou Vierge", "pla": "Mercure — mercredi — vif argent", "arabe": "Al kausaji (qui a la barbe rare)", "lat": "Puer (le garçon)", "sis": "Sidjou", "lab": "Yonissa", "kai": "Dianfa Almamy", "astro": "maison du sujet", "kaiMaison": "Ni so — maison de la vie", "kaiSigne": "Janfa almami", "key": "puer", "latin": "Puer", "fr": "le Garçon", "ag": {"planete": "Mars — Mars bienveillant", "signe": "non donné (le texte imprimé attribue le Scorpion à « Puella and Rubeus »)", "tripSignes": "feu", "tripNatures": "feu", "tripVulgaire": "air", "zodiaque": "Scorpion"}, "ronecker": "", "qual": [["Agrippa", "Mars bienveillant"], ["Kassibo p. 578", "incarne la trahison et la méchanceté (avec Nunkoro) ; un des kèlè denw (combattants)"]], "jugFR": ["Puer en la première maison donne une vie passablement longue, mais laborieuse ; il élève les hommes à une grande renommée par la dignité militaire ; il signifie une personne au corps vigoureux, au teint coloré, au beau visage et aux cheveux noirs.", "En la deuxième maison, Puer augmente l’avoir obtenu par les biens d’autrui, par pillages, rapines, confiscations, lois militaires et choses semblables ; il cache le voleur et la chose volée, mais ne découvre aucun trésor.", "En la troisième maison, Puer élève un homme en honneur au-dessus de ses frères et le fait craindre d’eux ; il signifie des voyages dangereux, et dénote des personnes de bon crédit.", "En la quatrième maison, Puer signifie des héritages et des possessions douteux, et signifie qu’un père parvient à son avoir et à son état par la violence.", "En la cinquième maison, Puer montre de bons enfants, qui parviendront aux honneurs et aux dignités ; il signifie qu’une femme aura un garçon, et montre des honneurs acquis par la discipline militaire, et une renommée grande et pleine.", "En la sixième maison, Puer cause des maladies et infirmités violentes, comme blessures, chutes, contusions, meurtrissures, mais délivre aisément le malade, et montre le médecin et le chirurgien bons ; il dénote des serviteurs et des animaux bons, forts et profitables.", "En la septième maison, Puer fait d’une épouse une virago, d’un esprit hardi, de bonne fidélité, qui aime tenir le commandement et le gouvernement d’une maison ; il cause des querelles et des procès cruels, et des adversaires que la justice aura peine à contenir.", "Puer en la huitième maison montre vivant celui qu’on suppose mort ; il signifie une mort ni douloureuse ni pénible, mais venant de quelque humeur chaude, ou par le fer, ou l’épée, ou par quelque autre cause de même sorte ; il montre qu’un homme n’aura ni legs ni autre héritage.", "En la neuvième maison, Puer montre des voyages qu’on n’entreprend pas sans péril et danger de la vie, mais qu’il déclare néanmoins accomplis heureusement et en sûreté ; il montre des personnes de peu de religion et de peu de conscience, mais donne la connaissance de la philosophie naturelle et de la médecine, et de beaucoup d’autres arts libéraux et excellents.", "Puer en la dixième maison signifie des princes puissants, glorieux et célèbres par leurs exploits guerriers, mais inconstants et changeants, à cause du succès variable et changeant de la victoire. Puer en cette maison rend les juges cruels et sans pitié ; il accroît les charges dans les affaires de guerre ; il signifie une magistrature exercée par le fer et le feu ; il nuit à une mère et met sa vie en danger.", "En la onzième maison, Puer montre des amis nobles et des hommes nobles, qui fréquenteront beaucoup les cours des princes et suivront la guerre ; et il fait que beaucoup s’attachent à des hommes cruels ; néanmoins il procure beaucoup d’estime auprès des princes, mais leur faveur est à tenir pour suspecte.", "Puer en la douzième maison rend les ennemis cruels et pernicieux ; ceux qui sont en prison s’échapperont, et il leur fait éviter beaucoup de dangers."], "jugEN": ["Puer in the first House gives an indifferent long life, but laborious raises men to great fame through military dignity; signifies a person of a strong body, ruddy complexion, a fair countenance, and black hair.", "In the second House Puer increases substance, obtained by other men's goods, by plunderings, rapines, confiscations, military Laws, and such like; he concealeth both the thief and the thing stolen, but discovers no treasure.", "In the third House Puer raises a man to honor above his brethren, and to be feared of them; signifies journies to be dangerous, and denotes persons of good credit.", "In the fourth House Puer signifies dubious inheritances and possessions, and signifies a Father to attain to his substance and estate through violence.", "In the fifth House Puer shows good children, and such as shall attain to honors and dignities; he signifies a woman to have a male-child, and shows honors to be acquitted by military discipline, and great and full fame.", "In the sixth House Puer causes violent diseases and infirmities, as wounds, falls, contusions, bruises, but easily delivers the sick, and shows the Physician and Surgeon to be good; denotes servants and animals to be good, strong and profitable.", "In the seventh House Puer causes a wife to be a virago, of a stout Spirit, of good fidelity, and one that loves to bear the Rule and Government of a house; makes cruel strifes and contentions, and such adversaties, as shall scarcely be restrained by Justice.", "Puer in the eighth House shows him that is supposed to be dead to live, signifies the kind of death not to be painful, or laborious, but to proceed from some hot humor, or by iron, or the sword, or from some other cause of the like kind, shows a man to have no legacies or other inheritance.", "In the ninth House Puer shows journeys not to be undergone without peril and danger of life, yet nevertheless declares them to be accomplished prosperously and safely; shows persons of little Religion, and using little conscience, notwithstanding gives the knowledge of natural philosophy and physic, and many other liberal and excellent Arts.", "Puer in the tenth House signifies Princes to be powerful, glorious, and famous in warlike achievements, but they shall be unconstant and unchangeable, by reason of the mutable and various success of victory. Puer in this House causes Judges to cruel and unmerciful; increases offices in warlike affairs; signifies Magistracy to be exercised by fire and sword; hurts a Mother, and endangereth her life.", "In the eleventh House Puer shows Noble friends, and Noble men, and such as shall much frequent the Courts of Princes, and follow after warfare; and causes many to adhere to cruel men: nevertheless he causes much esteem with Princes; but their favor is to be suspected.", "Puer in the twelfth House causes Enemies to be cruel and pernicious; those that are in Prison shall escape, and makes them to eschew many dangers."]}, {"n": 2, "rows": [1, 2, 2, 2], "zen": "Dahika", "zenMaison": "Adama — maison des biens", "elem": "feu et est", "zod": "Sagittaire ou Poissons", "pla": "Jupiter — jeudi — étain", "arabe": "Adaïka (le rire)", "lat": "Laetitia (la joie)", "sis": "Adama", "lab": "Adama", "kai": "Adama", "astro": "maison des biens", "kaiMaison": "Garigé so — maison de la chance", "kaiSigne": "Adama", "key": "laetitia", "latin": "Laetitia", "fr": "la Joie", "ag": {"planete": "Jupiter — moindre, mais sans détriment", "signe": "Sagittaire", "tripSignes": "feu", "tripNatures": "air", "tripVulgaire": "air", "zodiaque": "Gémeaux"}, "ronecker": "", "qual": [["Agrippa", "Jupiter, moindre fortune, sans détriment"]], "jugFR": ["Laetitia en la première maison signifie une longue vie avec prospérité, beaucoup de joie et d’allégresse, et fait qu’un homme survive à tous ses frères et soit plus victorieux qu’eux ; elle signifie un homme de haute stature, aux beaux membres, au front large, aux dents grandes et larges, et au visage avenant et bien coloré.", "En la deuxième maison, elle signifie des richesses et de nombreux gains, mais de grandes dépenses et divers changements d’état et de condition ; le vol et toute chose perdue sont recouvrés et rendus ; mais si la question porte sur un voleur, elle le déclare enfui.", "En la troisième maison, Laetitia montre des frères de bonne fréquentation, mais de courte vie ; des voyages agréables et réconfortants ; des hommes de bon crédit et de bonne foi.", "En la quatrième, elle signifie des patrimoines et possessions heureux, un père noble, honoré de la dignité de quelque charge princière ; elle montre un trésor dans le lieu recherché, mais de moindre prix et valeur qu’on ne le suppose, et le fait trouver.", "En la cinquième maison, elle donne des enfants obéissants, doués de bonnes mœurs, en qui l’on trouvera la plus grande joie et le réconfort de la vieillesse ; elle signifie qu’une femme enceinte mettra au monde une fille ; elle montre des ambassades honorables, déclare les rumeurs et nouvelles entièrement vraies, et laisse une bonne et ample renommée après la mort.", "En la sixième maison, elle montre que le malade guérira ; elle dénote de bons serviteurs, du bétail et des animaux bons et profitables.", "En la septième maison, Laetitia donne une épouse belle, gracieuse et jeune ; elle surmonte les querelles et les procès, et en fait aboutir l’issue à l’amour.", "Laetitia en la huitième maison donne des legs et des possessions, et une dot honorable avec l’épouse ; si une question est posée sur l’état d’un homme, elle le signifie vivant, et déclare une mort honnête, paisible et douce.", "En la neuvième maison, Laetitia signifie très peu de voyages ; et ceux qui s’adonnent au voyage, leurs voyages concernent soit les messages et ambassades des princes, soit des pèlerinages pour accomplir des vœux saints ; elle montre un homme de bonne religion, de savoir moyen, qui saisit aisément toutes choses par son esprit naturel.", "En la dixième maison, elle élève les rois et les princes à l’honneur et à une grande renommée, et les rend célèbres par le maintien de la paix en leur temps ; elle signifie des juges cruels et sévères ; des charges et magistratures honnêtes ; elle signifie les choses qui s’exercent soit dans les affaires ecclésiastiques, soit dans les écoles, soit dans l’administration de la justice ; elle montre qu’une mère, si elle est veuve, se remariera.", "En la onzième maison, Laetitia accroît la faveur auprès des princes et multiplie les amis.", "Et en la douzième maison, Laetitia donne la victoire sur les ennemis ; elle procure de bons serviteurs et de bonnes familles, délivre de l’emprisonnement et préserve des maux à venir."], "jugEN": ["Laetitia in the first House signifies long life with prosperity, and much joy and gladness, and causes a man to outlive and be more victorious then all his brethren; signifies a man of a tall stature, fair members, a broad forehead, having great and broad teeth; and that has a face comely and well colored.", "In the second House it signifies riches and many gains, but great expenses and various mutations of ones state and condition; theft and any thing lost is recovered and returned: but if the Question be of a thief, it declares him to be fled away.", "In the third House Latitia shows brethren to be of a good conversation, but of short life; journeys pleasant and comfortable; men of good credit and faith.", "In the fourth he signifies happy Patrimonies and possessions, a Father to be noble, and honored with the dignity of some princely office; shows treasure to be in the place enquired after, but of less worth and value then is supposed, and causes it to be found.", "In the fifth House he gives obedient children, endued with good manners, and in whom shall be had the greatest joy and comfort of old age; signifies a woman with child to bring forth a daughter; shows honorable Embassages, and declares rumors and news to be altogether true, and leaves a good and ample fame after death.", "In the sixth House it shows the sick shall recover, denotes good servants, good and profitable cattle and animals.", "In the seventh House Laetitia gives a wife fair, beautiful and young; overcomes strifes and contentions, and rendereth the success thereof to be love.", "Laetitia in the eighth House gives Legacies and possessions, and a commendable portion with a wife: if a Question be proposed concerning the condition of any man, it signifies him to be alive, and declares an honest, quiet, and meek kind of death.", "In the ninth House Laetitia signifies very few journies, and those that do apply themselves to travail, their journyes either are about the Messages and Embassages of Princes, or Pilgrimages to fulfill holy vows; shows a man to be of a good religion, of indifferent knowledge, and who easily apprehends all things with natural ingenuity.", "In the tenth House, it raises Kings and Princes to honor and great renown; makes them famous by maintaining peace during their times; signifies Judges to be cruel and severe; honest Offices and Magistracy; signifies those things which are exercised either about Ecclesiastical affairs, schools, or the administration of justice; shows a mother if she be a widow, that she shall be married again.", "In the eleventh House Laetitia increases favor with Princes, and multiplies friends. And", "in the twelfth House Laetitia gives the victory over enemies; causes good servants and families, delivers from imprisonment, and preserves from future evils."]}, {"n": 3, "rows": [2, 1, 1, 1], "zen": "Otba ed dakhel", "zenMaison": "Mahdiou — maison de la famille, des frères et des sœurs", "elem": "vent et est", "zod": "Sagittaire ou Poissons", "pla": "Jupiter — jeudi — étain", "arabe": "Utuba dahili (le seuil intérieur de l'entrée)", "lat": "Caput draconis (la tête du dragon)", "sis": "Mahamadi", "lab": "Madi", "kai": "Maleju", "astro": "maison des familiers", "kaiMaison": "Ba so — maison de la famille, des frères et sœurs utérines", "kaiSigne": "Maleju", "key": "caput", "latin": "Caput draconis", "fr": "la Tête du dragon", "ag": {"planete": "Tête du Dragon — suit sa propre nature", "signe": "Capricorne", "tripSignes": "terre", "tripNatures": "terre", "tripVulgaire": "terre", "zodiaque": "Balance"}, "ronecker": "", "qual": [["Agrippa", "suit sa propre nature"], ["Kassibo p. 578", "bénéfique (Maleju)"]], "jugFR": ["Caput Draconis en la première maison augmente la vie et la fortune.", "En la deuxième maison, il augmente les richesses et l’avoir ; il sauve et cache le voleur ; et signifie qu’un trésor est caché.", "En la troisième maison, Caput Draconis donne beaucoup de frères ; il cause des voyages, des parents, et la bonne foi et le crédit.", "En la quatrième maison, il donne de riches héritages ; il fait parvenir le père à la vieillesse.", "En la cinquième maison, Caput Draconis donne beaucoup d’enfants ; il signifie que les femmes enceintes mettront au monde des filles, et souvent auront des jumeaux ; il montre de grands honneurs et une grande renommée ; et signifie que les nouvelles et rumeurs sont vraies.", "Caput Draconis en la sixième maison accroît les maladies et affections ; il signifie un médecin savant ; et donne de très nombreux serviteurs et beaucoup de bétail.", "En la septième maison, il signifie qu’un homme aura beaucoup d’épouses ; il multiplie et suscite beaucoup d’adversaires et de procès.", "En la huitième maison, il montre la mort certaine, accroît les legs et les héritages, et donne une bonne dot avec l’épouse.", "En la neuvième maison, Caput Draconis signifie beaucoup de voyages, beaucoup de sciences, et une bonne religion ; et montre que les absents reviendront bientôt.", "En la dixième maison, il signifie des princes glorieux, des juges grands et magnifiques, de grandes charges et une magistrature lucrative.", "En la onzième maison, il fait avoir beaucoup d’amis et être aimé de tous.", "En la douzième maison, Caput Draconis signifie que les hommes ont beaucoup d’ennemis et beaucoup de femmes ; il retient les prisonniers et les punit durement."], "jugEN": ["Caput Draconis in the first House augmenteth life and fortune.", "In the second House he increases riches and substance; saves and concealeth a thief; and signifies treasure to be hid.", "In the third House Caput Draconis gives many brethren; causes journeys, kinsmen, and good faith and credit.", "In the fourth House he gives wealthy inheritances; causes the Father to attain to old age.", "In the fifth House Caput Draconis gives many children; signifies women with child to bring forth women-children, and oftentimes to have twins; it shows great honors and fame; and signifies news and rumors to be true.", "Caput Draconis in the sixth House increases sicknesses and diseases; signifies the Physician to be learned; and gives very many servants and chattel.", "In the seventh House he signifies a man shall have many wives; multiplies and stirs up many adversaries and suits.", "In the eight House he shows the death to be certain, increases Legacies and inheritances, and gives a good portion with a wife.", "In the ninth House Caput Draconis signifies many journeys, many Sciences, and good Religion; and shows that those that are absent shall soon return?", "In the tenth House he signifies glorious Princes, great and magnificent Judges, great Offices, and gainful Magistracy.", "In the eleventh House he causes many friend, and to be beloved of all men.", "In the twelfth House Caput Draconis signifies men to have many enemies, and many women; detaineth the imprisoned, and evilly punishes them."]}, {"n": 4, "rows": [2, 2, 1, 2], "zen": "Al Bayada", "zenMaison": "Idrissa — maison du pays", "elem": "eau et nord", "zod": "Écrevisse", "pla": "Lune — lundi — argent", "arabe": "Al bayada (la blancheur)", "lat": "Albus (le blanc)", "sis": "Albâyâlou", "lab": "Idrissa", "kai": "Albayada", "astro": "maison du père", "kaiMaison": "Fa so — maison du père", "kaiSigne": "Albayada", "key": "albus", "latin": "Albus", "fr": "le Blanc", "ag": {"planete": "Mercure — bonne", "signe": "Gémeaux", "tripSignes": "air", "tripNatures": "terre", "tripVulgaire": "eau", "zodiaque": "Lion"}, "ronecker": "Le Blanc, bonne figure ; en s’inversant il devient le Rouge, générateur de problèmes et d’ennuis en tout genre.", "qual": [["Agrippa", "Mercure, bonne"], ["Ronecker", "bonne figure"]], "jugFR": ["Albus en la première maison signifie une vie tourmentée de maladies continuelles et de graves affections ; il signifie un homme de petite stature, à la poitrine large et aux bras épais, aux cheveux bouclés ou crépus, à la bouche large et pleine, grand parleur et bavard, très porté aux discours vains et inutiles, mais gai, joyeux et jovial, et plaisant beaucoup aux gens.", "En la deuxième maison, Albus agrandit et augmente l’avoir gagné par les divertissements, les jeux, les arts et exercices vils et bas, mais plaisants et agréables, comme les jeux, passe-temps, danses et rires ; il découvre le voleur et le vol ou la chose volée, et cache et dissimule le trésor.", "En la troisième maison, Albus signifie très peu de frères ; il ne donne pas beaucoup de voyages, mais des voyages ennuyeux et fatigants, et signifie tous les trompeurs.", "En la quatrième maison, il montre un très petit patrimoine ou aucun, et un père très connu ; mais il le déclare homme de quelque charge ou emploi bas et inférieur.", "En la cinquième maison, Albus ne donne pas d’enfants, ou s’il en donne, ils mourront bientôt ; il déclare une femme servile, et fait que celles qui sont enceintes avortent, ou bien mettent au monde des monstres ; il dénote que toutes les rumeurs sont fausses, et n’élève à aucun honneur.", "En la sixième maison, Albus cause des maladies et affections très longues ; il découvre la fraude, la tromperie et la méchanceté des serviteurs, et signifie que les maladies et infirmités du bétail sont mortelles, et rend le médecin suspect au patient malade.", "Albus en la septième maison donne une épouse stérile, mais belle et gracieuse ; peu de procès ou de différends, mais de très longue durée.", "En la huitième maison, si une question est posée sur quelqu’un, Albus montre que la personne est morte ; il donne peu de dot avec l’épouse, et fait qu’on se la dispute et qu’on la conteste beaucoup.", "En la neuvième maison, Albus dénote quelques voyages accomplis, mais d’un profit médiocre ; il retient l’absent et signifie qu’il ne reviendra pas ; et déclare un homme superstitieux en religion, et adonné aux sciences fausses et trompeuses.", "En la dixième, Albus rend les princes et les juges malveillants ; il montre des charges et magistratures viles et basses ; il signifie une mère prostituée, ou fort soupçonnée d’adultère.", "En la onzième maison, Albus fait des amis dissimulés et faux ; il rend l’amour et la faveur inconstants.", "Albus en la douzième maison dénote des ennemis vils, impuissants et rustres ; il montre que ceux qui sont en prison ne s’échapperont pas, et signifie un très grand nombre de troubles et d’incommodités variés dans la vie."], "jugEN": ["Albus in the first House signifies a life vexed with continual sickness and grievous diseases; signifies a man of a short stature, broad breast, and gross arms, having curled or crisped hair, one of a broad full mouth, a great talker and babbler, given much to use vain and unprofitable discourse, but one that is merry, joyous and jocond, and much pleasing to men.", "In the second House Albus enlarges and augmenteth substance gained by sports, plays, vile and base arts and exercises, but such as are pleasing and delightful; as by plays, pastimes, dancings and laughters: he discovers both the thief, and the theft or thing stolen, and hides and concealeth treasure.", "In the third House Albus signifies very few brethren; gives not many, but tedious and wearisome journyes, and signifies all deceivers.", "In the fourth House he shows very small or no Patrimony, and the Father to be a man much known; but declares him to be a man of some base and inferior Office and Employment.", "In the fifth House Albus gives no children, or if any, that they shall soon die; declares a woman to be servile, and causes such as are with young to miscarry, or else to bring forth Monsters; denotes all rumors to be false, and raises to no honor.", "In the sixth House Albus causes very tedious sicknesses and diseases; discovers the fraud, deceit and wickedness of servants, and signifies diseases and infirmities of cattle to be mortal, and makes the Physician to be suspected of the sick Patient.", "Albus in the seventh House gives a barren wife, but one that is fair and beautiful; few suits or controversies, but such as shall be of very long continuance.", "In the eighth House if a question be propounded of any one, Albus shows the party to be dead; gives little portion or dowry with a wife, and causes that to be much strived and contended for.", "In the ninth House Albus denotes some journyes to be accomplished, but with mean profit; hinders him that is absent, and signifies he shall not return; and declares a man to be superstitious in Religion, and given to false and deceitful Sciences.", "In the tenth Albus causes Princes and Judges to be malevolent; shows vile and base Offices and Magistracies; signifies a Mother to be a whore, or one much suspected for adultery.", "In the eleventh House Albus makes dissembling and false friends; causes love and favor to be inconstant.", "Albus in the twelfth House denotes vile, impotent and rustical enemies; shows such as are in prison shall not escape, and signifies a great many and various troubles and discommodities of ones life."]}, {"n": 5, "rows": [1, 1, 1, 1], "zen": "Et Tariqi", "zenMaison": "Ibrahima — maison des enfants et des nouvelles", "elem": "eau et nord", "zod": "Écrevisse", "pla": "Lune — lundi — argent", "arabe": "Et tariqi (le chemin, la route)", "lat": "Via (la route)", "sis": "Tarika", "lab": "Ibrahima", "kai": "Tariki Ibrahima", "astro": "maison des enfants", "kaiMaison": "Den so — maison des enfants", "kaiSigne": "Tariki Ibrahima", "key": "via", "latin": "Via", "fr": "la Voie (la route)", "ag": {"planete": "Lune — depuis son commencement et sa croissance", "signe": "Cancer", "tripSignes": "eau", "tripNatures": "eau", "tripVulgaire": "eau", "zodiaque": "Vierge"}, "ronecker": "La Voie, l’une des quatre figures Mères qui ne s’inversent pas : bien tracée et directe, mais indécise car on ne sait où elle mène ; elle participe de l’impair (quatre fois un point). Épine dorsale, axe du monde, elle s’implique dans le cheminement solitaire, à l’image du Mat du tarot, et relie les complémentaires et les opposés. Dessin « Un » (p. 23).", "qual": [["Agrippa", "Lune (aucune qualité dite)"]], "jugFR": ["Via en la première maison accorde une vie longue et prospère ; elle a signification d’un étranger, maigre de corps et de haute stature, au teint clair, à la barbe peu fournie ; une personne libérale et agréable, mais lente et peu portée au travail.", "En la deuxième, elle augmente l’avoir et les richesses ; elle fait recouvrer ce qui est volé ou perdu ; mais elle signifie que le voleur est parti hors de la ville.", "En la troisième, elle multiplie frères et parents ; elle signifie des voyages continuels et prospères ; des hommes publiquement connus, honnêtes et de bonne fréquentation.", "Via en la quatrième maison signifie un père honnête ; elle accroît le patrimoine et l’héritage ; elle produit des champs riches ; elle montre qu’il y a un trésor dans le lieu recherché ; elle fait recouvrer ce qui est perdu.", "En la cinquième, elle accroît le nombre des enfants mâles ; elle montre qu’une femme enceinte mettra au monde un garçon ; elle envoie des ambassades en pays étrangers et lointains ; elle accroît les honneurs publics ; elle signifie une mort honnête, et connue dans de nombreuses provinces.", "En la sixième maison, Via préserve de la maladie ; elle signifie que le malade guérira promptement ; elle donne des serviteurs profitables, et des animaux féconds et profitables.", "En la septième maison, elle accorde une épouse belle et agréable, avec qui l’on jouira d’une félicité perpétuelle ; elle fait que les querelles et procès soient très promptement terminés ; que les adversaires soient aisément vaincus, et qu’ils soumettent volontiers leurs différends à l’arbitrage de gens de bien.", "En la huitième maison, elle montre une mort venant de maladies flegmatiques, honnête et de bonne réputation ; elle découvre de grands legs et de riches héritages à recevoir des morts ; et si l’on a rapporté que quelqu’un est mort, elle le montre vivant.", "En la neuvième maison, Via cause de longs voyages par eau, surtout par mer, et présage de très grands gains à en tirer ; elle dénote les prêtrises et les profits des emplois ecclésiastiques ; elle fait des hommes de bonne religion, droits et constants dans la foi ; elle montre que les songes sont vrais et que leur signification apparaîtra soudain ; elle accroît les sciences philosophiques et grammaticales, et ce qui touche à l’instruction et à l’éducation des enfants.", "Si Via se trouve en la dixième maison, elle rend les rois et les princes heureux et fortunés, maintenant une paix continuelle avec leurs alliés, et recherchant l’amitié de nombreux princes par leurs diverses ambassades ; elle favorise les honneurs publics, les charges et la magistrature parmi le vulgaire et le menu peuple, ou dans les affaires touchant l’eau, les voyages, ou la levée des tailles et impositions ; elle montre des juges justes et miséricordieux, qui expédieront vite les causes pendantes devant eux ; et dénote une mère de bonne réputation, en bonne santé et de longue vie.", "En la onzième maison, elle suscite beaucoup d’amis riches, et acquiert des amis fidèles dans les provinces et pays étrangers, qui secourront volontiers celui qui les sollicite, avec toute aide et diligence. Elle met les personnes en profit et en confiance auprès des princes, qui les emploient à des charges telles qu’elles seront embarrassées de voyages continuels.", "Via en la douzième maison cause beaucoup d’ennemis, mais dont il y a peu de mal ou de danger à craindre ; elle signifie des serviteurs et des animaux profitables ; que celui qui est en prison s’en échappera ou en sera promptement délivré ; et elle préserve un homme des mauvais accidents de la fortune."], "jugEN": ["Via in the first House, bestows a long and prosperous life; gives signification of a stranger; lean of body, and tall of stature; fair of complexion, having a small beard: a person liberal and pleasant; but slow, and little addicted to labor.", "In the second, he increases substance and riches; recovereth any thing that is stolen or lost; but signifies the thief to be departed without the City.", "In the third, he multiplies brethren and kinsfolks; signifies continual journeys, and prosperous; men that are publicly known, honest, and of good conversation.", "Via in the fourth House, signifies the father to be honest; increases the Patrimony and Inheritance; produces wealthy fields; shows treasure to be in the place enquired after; recovereth any thing lost.", "In the fifth, he increases the company of male-children; shows a woman with child to bring forth a male-childe; sends Embassages to strange and remote parts; increases public honors; signifies an honest kind of death, and to be known through many Provinces", "In the sixth House, Via preserves from sickness; signifies the diseased speedily to recover; gives profitable servants, and animals fruitful and profitable.", "In the seventh House, he bestows a wife fair and pleasant, with whom you shall enjoy perpetual felicity: causes strifes and controversies most speedily to be determined; adversaries to be easily overcome, and that shall willingly submit their controversies to the Arbitration of good men.", "In the eighth House, he shows the kind of death to proceed from Phlegmatic diseases; to be honest, and of good report: discovers great Legacies, and rich Inheritances to be obtained by the dead: And if any one has been reported to be dead, it shows him to be alive.", "In the ninth House, Via causes long journeys by water, especially by Sea, and portendeth very great gains to be acquired thereby: he denotes Priesthoods, and profits from Ecclesiastical employments; makes men of good Religion, upright, and constant of faith: shows dreams to be true, whose signification shall suddenly appear: increases Philosophical and Grammatical Sciences, and those things which appertain to the instruction and bringing up of children.", "In the tenth House if Via be found, he makes Kings and Princes happy and fortunate, and such as shall maintain continual peace with their Allies; and that they shall require amity and friendship amongst many Princes by their several Embassages: promoteth public Honors, Offices, and Magistracy amongst the vulgar and common people; or about things pertaining to the water, journeys, or about gathering Taxes and Assesments: shows Judges to be just and merciful, and that shall quickly dispatch Causes depending before them: and denotes a mother to be of good repute, healthy, and of long life.", "In the eleventh House, he raises many wealthy friends, and acquireth faithful friends in foreign Provinces and Countries, and that shall willingly relieve him that requires them, with all help and diligence: It ingratiates persons with profit and trust amongst Princes, employing him in such Offices, as he shall be encumbered with continual travels.", "Via in the twelfth House, causes many enemies, but such as of whom little hurt or danger is to be feared: signifies servants and animals to be profitable: whosoever is in prison, to be escaped, or speedily to be delivered from thence: and preserves a man from the evil accidents of Fortune."]}, {"n": 6, "rows": [1, 2, 1, 2], "zen": "Gabda el Khakhidja", "zenMaison": "Issa — maison des maladies et des esclaves", "elem": "eau et nord", "zod": "Scorpion et Bélier", "pla": "Mars — mardi — fer", "arabe": "Kabula haraji (la poignée entrante)", "lat": "Amissio (la perte)", "sis": "Kalazan", "lab": "Issa", "kai": "N'gansa", "astro": "maison de la servitude", "kaiMaison": "Dimi so — maison des maladies", "kaiSigne": "N'gansa", "key": "amissio", "latin": "Amissio", "fr": "la Perte", "ag": {"planete": "Vénus — comme rétrograde ou combuste", "signe": "Balance", "tripSignes": "air (imprimé « Amitia »)", "tripNatures": "feu", "tripVulgaire": "feu", "zodiaque": "Sagittaire"}, "ronecker": "", "qual": [["Agrippa", "Vénus comme rétrograde ou combuste"], ["Kassibo p. 578", "puissance de l’ombre qui sème la mort et l’affliction ; un des kèlè denw"]], "jugFR": ["Amissio en la première maison signifie que le malade ne vivra pas longtemps, et montre une vie courte ; elle signifie un homme aux membres disproportionnés, de vie et de conduite mauvaises, et marqué de quelque défaut notoire et remarquable en une partie du corps, comme boiteux, estropié ou semblable.", "Amissio en la deuxième maison consume tout l’avoir et fait souffrir et supporter le fardeau d’une misérable pauvreté ; ni le voleur ni la chose volée ne seront trouvés ; elle signifie qu’il n’y a pas de trésor dans le lieu recherché, et qu’on le cherchera avec perte et dommage.", "En la troisième maison, Amissio signifie la mort des frères, ou leur absence, ainsi que des parents et des amis ; elle ne signifie aucun voyage, et fait qu’on est trompé par beaucoup.", "En la quatrième maison, Amissio signifie la destruction totale du patrimoine, montre le père pauvre et le fils mourant.", "Amissio en la cinquième maison montre la mort des enfants et afflige un homme de diverses douleurs ; elle signifie qu’une femme n’est pas enceinte, ou bien qu’elle a fait une fausse couche ; elle n’élève ni renommée ni honneurs, et répand de fausses rumeurs.", "En la sixième maison, Amissio signifie que le malade est guéri, ou qu’il guérira bientôt ; mais elle cause perte et dommage par les serviteurs et le bétail.", "En la septième maison, Amissio donne une épouse adultère, contrariant son mari par une querelle continuelle ; néanmoins elle ne vivra pas longtemps ; et elle fait que les querelles prennent fin.", "En la huitième maison, Amissio signifie qu’un homme est mort ; elle consume la dot d’une épouse ; elle n’accorde ni n’envoie d’héritages ni de legs.", "En la neuvième maison, Amissio ne cause pas de voyages, sinon accompagnés de très grandes pertes ; elle signifie des hommes inconstants en religion, changeant souvent d’opinion d’une secte à l’autre, et tout à fait ignorants des lettres.", "En la dixième maison, Amissio rend les princes très infortunés et montre qu’ils seront contraints de finir leur vie en exil et bannissement ; des juges méchants ; elle signifie des charges et magistratures dommageables, et montre la mort d’une mère.", "En la onzième maison, Amissio signifie peu d’amis, fait qu’on les perd aisément et qu’ils deviennent ennemis ; et fait qu’un homme n’a aucune faveur auprès de son prince, sinon à son détriment.", "En la douzième maison, Amissio détruit tous les ennemis, retient longtemps en prison, mais préserve des dangers."], "jugEN": ["Amissio in the first House signifies the sick not to li^e long, and shows a short life; signifies a man of disproportioned members of his body, and one of a wicked life and coversation, and who is marked with some notorious and remarkable defect in some part of his body, as either lame, or maimed, or the like.", "Amissio in the second House consumes all substance, and makes one to suffer and undergo the burden of miserable poverty; neither thief, nor the thing stolen shall be found; signifies treasure not to be in the place sought after, and to be sought for with loss and damage.", "In the third House Amissio signifies death of brethren, or the want of them, and of kindred and friends; signifies no journeys, and causes one to be deceived of many.", "In the fourth House Amissio signifies the utter destruction of ones Patrimony, shows the Father to be poor, and Son to die.", "Amissio in the fifth House shows death of children, and afflicts a man with diverse sorrows; signifies a woman not to be with child, or else to have miscarried; raises no fame or honors, and disperseth false rumors.", "In the sixth House Amissio si nifies the sick to be recovered, or that he shall soon recover; but causes loss and damage by servants and cattels.", "In the seventh House Amissio gives an adulterous wife, and contrarying her husband with continual contention; nevertheless she shall not live long; and it causes contentions to be ended.", "In the eighth House Amissio signifies a man to be dead, consumes the dowry of a wife; bestows or sends no inheritances or legacies.", "In the ninth House Amissio causes no journies, but such as shall be compassed with very great loss; signifies men to be inconstant in Religion, and often changing their opinion from one sect to another, and altogether ignorant of learning.", "In the tenth House Amissio rendereth Princes to be most unfortunate, and shows that they shall be compelled to end their lives in exile and banishment; Judges to be wicked; and signifies Offices and Magistracy to be damageable, and shows the death of a Mother.", "In the eleventh House Amissio signifies few friends, and causes them to be easily lost, and turned to become enemies; and causes a man to have no favor with his Prince, unless it be hurtful to him.", "In the twelfth House Amissio destroys all enemies, detaineth long in prison, but preserves from dangers."]}, {"n": 7, "rows": [2, 1, 2, 2], "zen": "Al Omra", "zenMaison": "Oumarou — maison du mariage et des époux", "elem": "vent et sud", "zod": "Scorpion et Bélier", "pla": "Mars — mardi — fer", "arabe": "Al humura ou el omra (la rougeur)", "lat": "Rubeus (le rouge)", "sis": "Lomara", "lab": "Oumarou", "kai": "Lumara", "astro": "maison des adversaires", "kaiMaison": "Furu so — maison du mariage", "kaiSigne": "Lumara", "key": "rubeus", "latin": "Rubeus", "fr": "le Rouge", "ag": {"planete": "Mars — Mars malveillant", "signe": "Scorpion", "tripSignes": "eau", "tripNatures": "feu", "tripVulgaire": "feu", "zodiaque": "Cancer"}, "ronecker": "Le Rouge, générateur de problèmes et d’ennuis en tout genre ; c’est l’inverse du Blanc, bonne figure.", "qual": [["Agrippa", "Mars malveillant"], ["Ronecker", "générateur de problèmes et d’ennuis"]], "jugFR": ["Rubeus en la première maison signifie une vie courte et une mauvaise fin ; il signifie un homme sale, inutile, au visage mauvais, cruel et malveillant, ayant quelque signe ou cicatrice remarquable et notable en une partie du corps.", "En la deuxième maison, Rubeus signifie la pauvreté, et fait des voleurs et des brigands, et des gens qui acquerront et chercheront leur entretien et leur subsistance par des arts faux, méchants, mauvais et illicites ; il préserve les voleurs et cache le vol ; et signifie qu’aucun trésor n’est caché ni ne sera trouvé.", "En la troisième maison, Rubeus rend frères et parents pleins de haine et odieux les uns aux autres, et les montre de mauvaises mœurs et de mauvaise disposition ; il rend les voyages très dangereux, et annonce la mauvaise foi et la trahison.", "En la quatrième maison, il détruit et consume les patrimoines, disperse et gaspille les héritages et les réduit à rien ; il détruit les fruits des champs par les intempéries et la malignité de la terre ; et amène le père à une mort prompte et soudaine.", "Rubeus en la cinquième maison donne beaucoup d’enfants, mais soit ils seront méchants et désobéissants, soit ils affligeront leurs parents de chagrin, de honte et d’infamie.", "En la sixième maison, Rubeus cause des blessures, maladies et affections mortelles ; celui qui est malade mourra ; le médecin se trompera, les serviteurs se montreront faux et traîtres, le bétail et les bêtes produiront mal et danger.", "En la septième maison, Rubeus signifie une épouse infâme, publiquement adultère et querelleuse ; des adversaires trompeurs et traîtres, qui s’efforceront de vous vaincre par les ruses et les détours rusés et subtils de la loi.", "En la huitième maison, Rubeus signifie une mort violente infligée par l’exécution de la justice publique ; il signifie, si l’on s’enquiert de quelqu’un, qu’il est certainement mort ; et qu’une épouse n’aura ni part ni dot.", "Rubeus en la neuvième maison montre des voyages mauvais et dangereux, et qu’un homme sera en danger d’être dépouillé par des voleurs et des brigands, ou d’être pris par des pillards ; il déclare des hommes aux opinions les plus mauvaises en religion, de mauvaise foi, et qui se laisseront souvent aisément amener à renier et quitter leur foi pour la moindre occasion ; il dénote des sciences fausses et trompeuses, et leurs professeurs ignorants.", "En la dixième maison, Rubeus signifie des princes cruels et tyranniques, dont le pouvoir viendra à une mauvaise fin : soit ils seront cruellement assassinés et détruits par leurs propres sujets, soit ils seront pris captifs par leurs vainqueurs et mis à une mort ignominieuse et cruelle, soit ils finiront misérablement leur vie en dure prison ; il signifie des juges et des officiers faux, voleurs, et adonnés à l’usure ; il montre qu’une mère mourra bientôt, et la dénote entachée d’une mauvaise renommée.", "En la onzième maison, Rubeus ne donne aucun ami vrai ni fidèle ; il montre des hommes de vie et de conduite méchantes, et fait qu’un homme est rejeté et chassé de toute société et fréquentation des gens bons et nobles.", "Rubeus en la douzième maison rend les ennemis cruels et traîtres, dont il faut se garder avec circonspection ; il signifie que ceux qui sont en prison viendront à une mauvaise fin ; et montre qu’un très grand nombre d’inconvénients et de malheurs arriveront dans la vie d’un homme."], "jugEN": ["Rubeus in the first House, signifies a short life, and an evil end; signifies a man to be filthy, unprofitable, and of an evil, cruel and malicious countenance, having some remarkable and notable sign or scar in some part of his body.", "In the second House Rubeus signifies poverty, and makes thieves and robbers, and such persons as shall acquire and seek after their maintenance and livelihoods by using false, wicked, and evil, and unlawful Arts; preserves thieves, and concealeth theft; and signifies no treasure to be hid nor found.", "In the third House Rubeus renders brethren and kinsmen to be full of hatred, and odious one to another, and shows them to be of evil manners, and ill disposition: causes journeys to be very dangerous, and foresheweth false faith and treachery.", "In the fourth House he destroys and consumes Patrimonies, and disperseth and wastes inheritances, causes them to come to nothing; destroys the fruits of the field by tempestuous seasons, and malignancy of the earth; and brings the Father to a quick and sudden death.", "Rubeus in the fifth House gives many children, but either they shall be wicked and disobedient, or else shall afflict their Parents with grief, disgrace and infamy.", "In the sixth House Rubeus causes mortal wounds, sicknesses and diseases; him that is sick shall die; the Physician shall err, servants prove false and treacherous, cartel and beasts shall produce hurt and danger.", "In the seventh House Rubeus signifies a wife to be infamous, publicly adulterate, and contentious; deceitful and treacherous adversaries, who shall endeavor to overcome you, by crafty and subtle wiles and circumventions of the Law.", "In the eighth House Rubeus signifies a violent death to be inflicted, by the execution of public Justice; and signifies, if any one be enquired after, that he is certainly dead; and a wise to have no portion or dowry.", "Rubeus in the ninth House shows journeys to be evil and dangerous, and that a man shall be in danger either to be spoiled by thieves and robbers, or to be taken by plunderers and robbers; declares men to be of most wicked opinions in Religion, and of evil faith, and such as will often easily be induced to deny and go from their faith for every small occasion; denotes Sciences to be false and deceitful, and the professors thereof to be ignorant.", "In the tenth House Rubeus signifies Princes to be cruel and tyrannical, and that their power shall come to an evil end, as that either they shall be cruelly murdered and destroyed by their own Subjects, or that they shall be taken captive by their conquerers, and put to an ignominious and cruel death, or shall miserably end their lives in hard imprisonment; signifies Judges and Officers to be false, theevish, and such as shall be addicted to usury; shows that a mother shall soon die, and denotes her to be blemished with an evil fame and report.", "In the eleventh House Rubeus gives no true, nor any faithful friends; shows men to be of wicked lives and conversations, and causes a man to be rejected and cast out from all society and conversation with good and noble persons.", "Rubeus in the twelfth House makes enemies to be cruel and traitorous, of whom we ought circumspectly to beware; signifies such as are in prison shall come to an evil end; and shows a great many inconveniences and mischiefs to happen in a man's life."]}, {"n": 8, "rows": [2, 2, 2, 1], "zen": "Al Mangoussi", "zenMaison": "Ayouba — maison de la mort et des angoisses", "elem": "terre et ouest", "zod": "Scorpion et Bélier", "pla": "Mars — mardi — fer", "arabe": "Al mankusu (le renversé)", "lat": "Tristitia (la tristesse)", "sis": "Almankeursi", "lab": "Yakouba", "kai": "Mankussi", "astro": "maison de la mort", "kaiMaison": "Banan so — maison de la mort", "kaiSigne": "Mankusi", "key": "tristitia", "latin": "Tristitia", "fr": "la Tristesse", "ag": {"planete": "Saturne — mauvaise", "signe": "Verseau", "tripSignes": "air", "tripNatures": "terre", "tripVulgaire": "terre", "zodiaque": "Sagittaire"}, "ronecker": "", "qual": [["Agrippa", "Saturne, mauvaise"], ["Kassibo p. 573, 578", "terre puissante et maléfique ; puissance de l’ombre ; un des kèlè denw"]], "jugFR": ["Tristitia en la première maison n’abrège pas la vie, mais l’afflige de nombreuses importunités ; elle signifie une personne de bonnes mœurs et de bonne tenue, mais solitaire, et lente dans toutes ses affaires et occupations ; solitaire, mélancolique, riant rarement, mais très avide de toutes choses.", "En la deuxième maison, elle donne beaucoup d’avoir et de richesses, mais ceux qui les ont n’en jouiront pas, et les cacheront plutôt, et s’en accorderont à peine la nourriture et la subsistance ; le trésor ne sera pas trouvé, ni le voleur, ni le vol.", "Tristitia en la troisième maison signifie qu’un homme a peu de frères, mais montre qu’il leur survivra à tous ; elle cause des voyages malheureux, mais donne la bonne foi.", "En la quatrième maison, Tristitia consume et détruit champs, possessions et héritages ; elle fait le père vieux et de longue vie, et grand thésauriseur d’argent très avare.", "En la cinquième maison, elle ne signifie pas d’enfants, ou qu’ils mourront bientôt ; elle montre qu’une femme enceinte mettra au monde une fille ; elle ne donne ni renommée ni honneurs.", "En la sixième maison, Tristitia montre que le malade mourra ; les serviteurs seront bons, mais paresseux ; et signifie que le bétail sera de petit prix ou de peu de valeur.", "En la septième maison, Tristitia montre que l’épouse mourra bientôt ; et déclare les procès et querelles très nuisibles, et tranchés contre vous.", "En la huitième maison, elle signifie une mort par longue et grave maladie, avec beaucoup de douleur et de peine ; elle donne des legs et un héritage, et dote une épouse d’une part.", "Tristitia en la neuvième maison montre que l’absent périra en voyage, ou signifie qu’un malheureux accident lui arrivera ; elle rend les voyages très infortunés, mais déclare des hommes de bonne religion, dévots, et de profonds lettrés.", "En la dixième maison, Tristitia signifie des princes sévères, mais très amoureux de la justice ; elle fait des juges justes, mais pénibles et lents à trancher les causes ; elle mène une mère à une bonne vieillesse, avec intégrité et honnêteté de vie, mais mêlée de diverses incommodités et infortunes ; elle élève à de grandes charges, mais on n’en jouira pas longtemps et l’on n’y persévérera pas ; elle signifie des charges qui touchent à l’eau, ou au labour et à l’amendement de la terre, ou à des matières de religion et de sagesse.", "En la onzième maison, Tristitia signifie la rareté des amis et la mort des amis ; et signifie aussi peu d’amour ou de faveur.", "En la douzième maison, elle ne montre pas d’ennemis ; elle condamne misérablement les prisonniers ; et fait arriver beaucoup d’incommodités et de pertes dans la vie."], "jugEN": ["Tristitia in the first House does not abbreviate life, but afflicts it with many molestations; signifies a person of good manners and carriage, but one that is solitary, and slow in all his business and occasions; one that is solitary, melancholy, seldom laughing, but most covetous after all things.", "In the second House it gives much substance and riches, but they that have them, shall not enjoy them, but shall rather hide them, and shall scarce afford to themselves food or sustenance therefrom; treasure shall not be found, neither shall the thief nor the theft.", "Tristitia in the third House signifies a man to have few brethren, but shows that he shall outlive them all; causes unhappy journeys, but gives good faith.", "In the fourth House Tristitia consumes and destroys fields, possessions and inheritances; causes a Father to be old and of long life, and a very covetous hoorder up of money.", "In the fifth House it signifies no children, or that they shall soon die; shows a woman with child to bring forth a woman-child, gives no fame nor honors.", "In the sixth House Tristitia shows that the sick shall die; servants shall be good, but slothful; and signifies cattle shall be of a small price or value.", "In the seventh House Tristitia shows that the wife shall soon die; and declares suits and contentions to be very hurtful, and determining against you.", "In the eighth House it signifies the kind of death to be with long and grievous sickness, and much dolor and pain; gives legacies and an inheritance, and indoweth a wife with a portion.", "Tristitia in the ninth House, shows that he that is absent shall perish in his journey; or signifies that some evil mischance shall happen unto him; causes journeys to be very unfortunate, but declares men to be of good Religion, devour, and profound Scholars.", "In the tenth House Tristitia signifies Princes to be severe, but very good lovers of justice; it causes just Judges, but such as are tedious and slow in determining of causes; brings a Mother to a good old age, with integrity and honesty of life, but mixed with diverse discommodities and misfortunes; it raises to great Offices, but they shall not be long enjoyed nor persevered in; it signifies such Offices as do appertain to the water, or tillage, and manuring of the Earth, or such as are to be employed about matters of Religion and wisdom.", "In the eleventh House Tristitia signifies scarcity of friends, and the death of friends; and also signifies little love or favor.", "In the twelfth House it shows no enemies; wretchedly condemns the imprisoned; and causes many discommodities and disprofits to happen in ones life."]}, {"n": 9, "rows": [1, 1, 2, 2], "zen": "Nacrat al Kharidja", "zenMaison": "Allah Taala — maison des voyages", "elem": "feu et est", "zod": "Lion", "pla": "Soleil — dimanche — or", "arabe": "Nasara haraji (la victoire sortante)", "lat": "Fortuna minor (la petite fortune)", "sis": "Kalalahoutâlâ", "lab": "Kalantala", "kai": "Kalalaw", "astro": "maison de la religion", "kaiMaison": "Sira so — maison des voyages", "kaiSigne": "Kalalaw", "key": "fortuna_minor", "latin": "Fortuna minor", "fr": "la Petite Fortune", "ag": {"planete": "Soleil — quand le Soleil est nocturne ou placé dans des dignités moindres", "signe": "Lion", "tripSignes": "feu", "tripNatures": "air", "tripVulgaire": "feu", "zodiaque": "Taureau"}, "ronecker": "La Petite Fortune, médiocre ; c’est l’inverse de la Grande Fortune, figure excellente.", "qual": [["Agrippa", "Soleil, moindre fortune"], ["Ronecker", "médiocre"]], "jugFR": ["Fortuna minor en la première maison donne une longue vie, mais embarrassée de diverses importunités et maladies ; elle signifie une personne de petite stature, au corps maigre, ayant un grain de beauté ou une marque au front ou à l’œil droit.", "En la deuxième maison, elle signifie un avoir, mais consumé par trop de prodigalité ; elle cache le voleur, et la chose volée ne se recouvre guère, sinon à grand-peine.", "En la troisième maison, elle cause la discorde entre frères et parents ; elle menace d’un danger en voyage, mais on y échappe ; elle rend les hommes de bonne foi, mais d’esprit fermé et secret.", "En la quatrième maison, elle porte préjudice aux patrimoines et aux héritages ; elle cache les trésors ; et les choses perdues ne se regagnent qu’avec grande difficulté. Elle signifie un père honnête, mais qui dépense son bien par prodigalité et laisse de petites parts à ses enfants.", "Fortuna minor en la cinquième maison donne peu d’enfants ; elle signifie qu’une femme enceinte aura une fille ; elle signifie des ambassades honorables, mais peu profitables ; elle élève à des honneurs médiocres ; elle donne une bonne renommée après la mort, mais peu répandue et de peu de durée.", "En la sixième maison, elle signifie des maladies sanguines et bilieuses ; elle montre le malade en grand danger, mais il guérira ; elle signifie des serviteurs fidèles, mais paresseux et peu utiles, et de même pour les autres animaux.", "En la septième maison, elle donne une épouse de bonne lignée, mais on aura avec elle beaucoup d’ennuis ; elle rend l’amour anxieux et inconstant ; elle prolonge les procès et fait que l’adversaire circonvient par beaucoup de chicanes ; mais avec le temps elle donne la victoire.", "En la huitième maison, elle montre une mort bonne et honnête, mais obscure, ou en pays étranger, ou en pèlerinage ; elle découvre des legs et des possessions, mais qui s’obtiennent par procès et avec difficulté ; elle dénote des funérailles et des sépultures obscures ; la dot d’une épouse difficile à obtenir, mais vite dépensée.", "En la neuvième maison, elle rend les voyages dangereux, et l’absent lent à revenir ; elle occupe les hommes aux offices de la religion ; elle montre des sciences inachevées, mais garde la constance dans la foi et la religion.", "En la dixième maison, elle signifie des rois et des princes puissants, mais qui acquièrent leur pouvoir par la guerre et la violence ; elle montre que les bannis reviendront bientôt ; elle découvre aussi des honneurs, de grandes charges et des bienfaits, mais pour lesquels on peinera et luttera sans cesse, et où l’on n’aura pas de stabilité. Un juge ne sera pas favorable ; elle prolonge les procès et les querelles ; elle montre qu’un père et une mère mourront bientôt et seront toujours affligés de nombreuses maladies.", "En la onzième maison, elle fait avoir beaucoup d’amis, mais pauvres et inutiles, incapables de secourir dans le besoin ; elle met en grâce auprès des princes et donne de grandes espérances, mais de petits gains ; et l’on ne restera pas longtemps dans un bénéfice ou une charge accordée par un prince.", "En la douzième maison, elle montre des ennemis rusés, subtils et trompeurs, qui cherchent à vous circonvenir par de nombreuses cabales secrètes ; elle signifie que le prisonnier sera longtemps détenu, mais enfin délivré ; elle montre les animaux stériles et les serviteurs inutiles ; et les changements de fortune fréquents, du bien au mal et du mal au bien."], "jugEN": ["Fortuna minor in the first house, gives long life, but encumbered with diverse molestations and sicknesses: it signifies a person of short stature, a lean body, having a mold or mark in his forehead or right eye.", "In the second House, he signifies substance, and that to be consumed with too much prodigality: hides a thief; and a thing stolen is scarcely to be recovered, but with great labor.", "In the third House, he causes discord amongst brethren and kinsfolks; threatens danger to be in a journey, but escapes it: renders men to be of good faith, but of close and hidden minds.", "In the fourth House, he prejudiceth Patrimonies and Inheritances; concealeth treasuries; and things lost cannot be regained, but with great difficulty: He signifies a father to be honest, but a spender of his estate through prodigality, leaving small portions to his children.", "Fortuna minor in the fifth House, gives few children; a woman with child he signifies shall have a woman-childe; signifies Embassages to be honorable, but little profitable; raises to mean honors; gives a good fame after death, but not much divulged; nor of lasting memory.", "In the sixth House, he signifies diseases, both Sanguine and Choleric; shows the sick person to be in great danger, but shall recover: signifies faithful servants, but slothful and unprofitable: And the same of other animals.", "In the seventh House, he gives a wife of a good progeny descended; but you shall be encumbered with many troubles with her: causes love to be anxious and unconstant: prolongeth contentions, and makes ones adversary to circumvent him with many cavillations; but in process of time he gives victory.", "In the eighth House, he shows the kind of death to be good and honest; but obscure, or in a strange place, or pilgrimage: discovers Legacies and Possessions; but to be obtained with suit and difficulty: denotes Funerals and Buryings to be obscure; the portion of a wife to be hardly gotten, but easily spent.", "In the ninth House, he makes journeys to be dangerous; and a party absent slowly to return: causes men to be occupied in offices of Religion: shows Sciences to be unaccomplished; but keeps constancy in faith and Religion.", "In the tenth House, he signifies Kings and Princes to be potent; but to gain their power with war and violence: banished men he shows shall soon return: it likewise discovers Honors, great Offices and benefits; but for which you shall continually labor and strive, and wherein you shall have no stable continuance: A Judge shall not favor you: Suits and contentions he prolongeth: A father and mother he shows shall soon die, and always to be affected with many diseases.", "In the eleventh House, he makes many friends; but such as are poor and unprofitable, and not able to relieve thy necessities: it ingratiates you with Princes, and gives great hopes, but small gains; neither long to continue in any benefice or offices bestowed by a Prince.", "In the twelfth House, he shows enemies to be crafty, subtle, and fraudulent, and studying to circumvent you with many secret factions: signifies one in prison to be long detained, but at length to be delivered: Animals he shows to be unfruitful, and servants unprofitable; and the changes of fortune to be frequent, from good to evil, and from bad to good."]}, {"n": 10, "rows": [1, 2, 2, 1], "zen": "Et Tiqaf", "zenMaison": "Souleymani — maison de la puissance publique et de l'autorité", "elem": "terre et ouest", "zod": "Capricorne et Verseau", "pla": "Saturne — samedi — plomb", "arabe": "Ackaf et thaqâfa (l'intelligence, l'instruction)", "lat": "Carcer (la prison)", "sis": "Téréméssé dit Diamfa Almamy", "lab": "Mansa Suleymane", "kai": "Mansa Solomani", "astro": "maison des honneurs", "kaiMaison": "Mansaya so — maison de la royauté, des honneurs / autorité publique", "kaiSigne": "Mansa Souleymani", "key": "carcer", "latin": "Carcer", "fr": "la Prison", "ag": {"planete": "Saturne — mauvaise, de plus grand détriment", "signe": "Capricorne", "tripSignes": "terre", "tripNatures": "terre", "tripVulgaire": "terre", "zodiaque": "Poissons"}, "ronecker": "La Prison, « le Gardien », l’une des quatre figures Mères qui ne s’inversent pas : elle équilibre pair et impair vers l’intérieur ; image de l’Œuf cosmique, de la Déesse-Mère, du ventre, matrice de la vie et porte des mondes souterrains. Dessin « Substantiel » (p. 23).", "qual": [["Agrippa", "Saturne, mauvaise, de plus grand détriment"]], "jugFR": ["Carcer placé en la première maison donne une vie courte ; il signifie des hommes très méchants, d’une figure et d’une forme sales, cruelles et impures, haïs et méprisés de tous.", "Carcer en la deuxième maison cause la pauvreté la plus cruelle et la plus misérable ; il signifie que le voleur et la chose volée seront pris et regagnés ; et montre qu’aucun trésor n’est caché.", "En la troisième maison, Carcer signifie haine et dissension entre frères ; de mauvais voyages ; une foi et une conduite très méchantes.", "Carcer en la quatrième maison signifie qu’un homme n’a ni possessions ni héritages, un père très méchant, qui mourra d’une mort soudaine et mauvaise.", "En la cinquième maison, Carcer donne beaucoup d’enfants ; il montre qu’une femme n’est pas enceinte, et pousse celles qui sont enceintes à avorter de leur propre consentement, ou tue l’enfant ; il ne signifie aucun honneur, et répand les rumeurs les plus fausses.", "En la sixième maison, Carcer fait subir au malade une longue maladie ; il signifie des serviteurs méchants, plutôt inutiles ; des médecins ignorants.", "En la septième maison, Carcer montre que l’épouse sera haïe de son mari, et signifie que procès et querelles seront mal terminés et mal réglés.", "En la huitième maison, Carcer déclare une mort par quelque chute, accident, ou fausse accusation, ou que des hommes seront condamnés en prison ou en jugement public, et les montre mis à mort, ou portant souvent sur eux-mêmes des mains violentes et mortelles ; il refuse à une épouse toute dot et tout legs.", "Carcer en la neuvième maison montre que l’absent ne reviendra pas, et signifie qu’un mal lui arrivera en voyage ; il dénote des personnes sans religion, de mauvaise conscience, et ignorantes des lettres.", "En la dixième maison, Carcer rend les princes très méchants et les fait périr misérablement, parce qu’une fois établis dans leur pouvoir ils s’adonneront entièrement à toute convoitise voluptueuse, au plaisir et à la tyrannie ; il rend les juges injustes et faux ; il déclare la mère cruelle, infâme et marquée du sceau de l’adultère ; il ne donne ni charges ni magistratures, sinon obtenues par le mensonge, ou par le vol, et par une rapine basse et cruelle.", "En la onzième maison, Carcer ne cause ni amis, ni amour, ni faveur parmi les hommes.", "En la douzième maison, il suscite des ennemis, retient en prison et inflige beaucoup de maux."], "jugEN": ["Carcer in the first House being posited, gives a short life; signifies men to be most wicked, of a filthy and cruel unclean figure and shape, and such as are hated and despised of all men.", "Carcer in the second House causes most cruel and miserable poverty; signifies both the thief and thing stolen to be taken and regained; and shows no treasure to be hid.", "In the third House Carcer signifies hatred and dissension amongst brethren; evil journeys, most wicked faith and conversation.", "Carcer in the fourth House signifies a man to have no possessions or inheritances, a Father to be most wicked, and to die a sudden and evil death.", "In the fifth House Carcer gives many children; shows a woman not to be with child, and provokes those that are with child to miscarry of their own consent, or slays the child; signifies no honors, and disperseth most false rumors.", "In the sixth House Carcer causes the diseased to undergo long sickness; signifies servants to be wicked, rather unprofitable; Physicians ignorant.", "In the seventh House Carcer shows the wife shall be hated of her husband, and signifies suits and contentions to be ill ended and determined.", "In the eighth House Carcer declares the kind of death to be by some fall, mischance, or false accusation, or that men shall be condemned in prison, or in public judgment, and shows them to be put to death, or that they shall often lay violent and deadly hands upon themselves; denies a wife to have any portion and legacies.", "Carcer in the ninth House, shows he that is absent shall not return, and signifies some evil shall happen to him in his journey; it denotes persons of no Religion, a wicked conscience, and ignorant of learning.", "In the tenth House Carcer causes Princes to be very wicked, and wretchedly to perish, because when they are established in their power, they will wholly addict themselves to every voluptuous lust, pleasure, and tyranny; causes Judges to be unjust and false; declares the Mother to be cruel, and infamous, and noted with the badge of adultery; gives no Offices nor Magistracies, but such as are gotten and obtained either by lying, or through theft, and base and cruel robbery.", "In the eleventh House Carcer causes no friends, nor love, nor favor amongst men.", "In the twelfth House it raises enemies, detaineth in prison, and inflicteth many evils."]}, {"n": 11, "rows": [2, 1, 1, 2], "zen": "Al Radjah", "zenMaison": "Ali — maison de la tutelle et de la protection des grands sur les humbles", "elem": "vent et sud", "zod": "Capricorne et Verseau", "pla": "Saturne — samedi — plomb", "arabe": "Ijitimay (l'union, la rencontre)", "lat": "Conjunctio (la réunion)", "sis": "N'Fali dit Badara Sadia", "lab": "Ali", "kai": "Badara Ali", "astro": "maison des amis", "kaiMaison": "Jigi so — maison des amis et de la protection", "kaiSigne": "Badara Ali", "key": "conjunctio", "latin": "Conjunctio", "fr": "la Conjonction (la réunion)", "ag": {"planete": "Mercure — bonne, la plus fortunée des deux", "signe": "Vierge", "tripSignes": "terre", "tripNatures": "air", "tripVulgaire": "air", "zodiaque": "Balance"}, "ronecker": "La Conjonction, « la Porte », l’une des quatre figures Mères qui ne s’inversent pas : elle équilibre pair et impair vers l’extérieur. Des
