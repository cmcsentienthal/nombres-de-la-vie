sin « Essentiel » (p. 23). Avec la Prison : tout ce qui s’est rencontré se séparera.", "qual": [["Agrippa", "Mercure, bonne et la plus fortunée"], ["Kassibo p. 578", "bénéfique (Badara Ali)"]], "jugFR": ["Conjunctio en la première maison donne une vie prospère et signifie un homme de stature moyenne, ni maigre ni gras, au visage long, aux cheveux lisses, à la barbe peu fournie, aux doigts et aux cuisses longs, libéral, aimable, et ami de beaucoup de gens.", "En la deuxième maison, Conjunctio ne signifie pas de richesses à acquérir, mais garde un homme sûr et à l’abri des calamités de la pauvreté ; elle découvre le voleur et la chose volée, et fait acquérir un trésor caché.", "En la troisième maison, elle donne des voyages variés aux succès variés, et signifie la bonne foi et la constance.", "En la quatrième maison, Conjunctio montre un patrimoine moyen ; elle rend le père honnête, de bonne réputation et de bon entendement.", "En la cinquième maison, elle donne des enfants d’esprit et d’ingéniosité subtils ; elle montre qu’une femme enceinte aura un garçon ; elle élève les hommes aux honneurs par leur seul esprit et leur seule ingéniosité, et répand au loin leur renommée et leur crédit ; elle signifie aussi que les nouvelles et rumeurs sont vraies.", "En la sixième maison, Conjunctio signifie des maladies ennuyeuses et de longue durée ; mais elle annonce un médecin savant et expérimenté ; et montre des serviteurs fidèles et irréprochables, et des animaux profitables.", "En la septième maison, elle donne une épouse très obéissante, accommodante et dévouée à son mari, et d’un bon esprit ; elle cause des procès et différends difficiles, et des adversaires rusés, subtils et malicieux.", "En la huitième maison, celui sur qui la question est posée, Conjunctio le signifie mort, et laisse entendre qu’un gain sera tiré de sa mort ; elle montre qu’une épouse ne sera pas très riche.", "En la neuvième maison, elle donne peu de voyages, mais longs et pénibles, et montre que l’absent reviendra après une longue saison. Conjunctio en cette maison accroît les divers arts, sciences et mystères de la religion, et donne un esprit vif, pénétrant et efficace.", "En la dixième maison, Conjunctio rend les princes libéraux, affables et bienveillants, prenant grand plaisir et affection aux diverses sciences et arts secrets, et aux hommes qui y sont savants ; elle rend les juges justes, et tels que par une spéculation pénétrante et subtile ils discernent aisément les causes débattues devant eux ; elle accroît les charges qui touchent aux lettres, au savoir, aux saines doctrines et aux sciences ; et signifie une mère honnête, de bon esprit, et de vie prospère.", "En la onzième maison, Conjunctio signifie un grand accroissement d’amis, et procure beaucoup la grâce et la faveur des princes, des hommes puissants et nobles.", "En la douzième maison, Conjunctio signifie des ennemis avisés et à l’esprit vif ; elle fait que ceux qui sont en prison y restent et y demeurent très longtemps ; et fait qu’un homme évite de très nombreux dangers en sa vie."], "jugEN": ["Conjunctio in the first House makes a prosperous life, and signifies a man of a middle stature, not lean nor fat, long face, plain hair, a little beard, long fingers and thighs, liberal, amiable, and a friend to many people.", "In the second House Conjunctio does not signify any riches to be gotten, but preserves a man secure and free from the calamities of poverty; detecteth both the thief and the thing stolen, and acquireth hidden treasure.", "In the third House he gives various journeys with various success, and signifies good faith and constancy.", "In the fourth House Conjunctio shows a mean Patrimony; causes a Father to honest, of good report, and of good understanding.", "In the fifth House he gives Children of subtle ingenuity and wit, shows a woman pregnant to have a male-child, and raises men to honors by their own mere proper wit and ingenuity, and disperseth their fame and credit far abroad; and also signifies news and rumors to be true.", "In the sixth House Conjunctio signifies sicknesses to be tedious and of long continuance; but foresheweth the Physician to be learned and well experienced; and shows servants to be faithful and blameless, and animals pro^table", "In the seventh House he gives a wife very obedient, conformable, and dutiful to her husband, and one of a good wit and ingenuity; causes difficult suits and controversies, and crafty, subtle and malicious adversaries.", "In the eighth House, him of whom a Question is propounded, Conjunctio signifies him to be dead, and pretends some gain to be acquired by his death; shows a wife shall not be very rich.", "In the ninth House he gives a few journeys, but long and tedious, and shows one that is absent shall after a long season return. Conjunctio in this House increases diverse Arts, Sciences, and Mysteries of Religion; and gives a quick, perspicuous, and efficacious wit.", "In the tenth House Conjunctio makes Princes liberal, affable and benevolent, and who are much delighted and affected with diverse Sciences, and secret Arts, and with men learned therein; causes Judges to be just, and such who with a piercing and subtle speculation, do easily discern causes in controversy before them; enlarges Offices which are concerned about Letters, Learning, sound Doctrines and Sciences; and signifies a Mother to be honest, of good ingenuity and wit, and also one of a prosperous life.", "In the eleventh House Conjunctio signifies great increase of friends; and very much procures the grace and favor of Princes, powerful and noble Men.", "In the twelfth House Conjunctio signifies wary and quick-witted enemies; causes such as are in prison to remain and continue so very long, and causes a man to eschew very many dangers in his life."]}, {"n": 12, "rows": [2, 2, 1, 1], "zen": "Nacrat ed dakhel", "zenMaison": "Nouhoun — maison des ennemis", "elem": "terre et ouest", "zod": "Taureau et Balance", "pla": "Vénus — vendredi — cuivre", "arabe": "Nasara dahili (la victoire)", "lat": "Fortuna major (la grande fortune)", "sis": "Anabi Nouhoun (Noé)", "lab": "Nouhou", "kai": "Nunkoro", "astro": "maison des afflictions", "kaiMaison": "Jugu so — maison des ennemis", "kaiSigne": "Nunkoro", "key": "fortuna_major", "latin": "Fortuna major", "fr": "la Grande Fortune", "ag": {"planete": "Soleil — quand le Soleil est diurne et placé dans ses dignités", "signe": "Lion", "tripSignes": "feu", "tripNatures": "feu", "tripVulgaire": "terre", "zodiaque": "Taureau"}, "ronecker": "La Grande Fortune, figure excellente ; en s’inversant elle devient la médiocre Petite Fortune.", "qual": [["Agrippa", "Soleil, grande fortune"], ["Ronecker", "excellente"], ["Kassibo p. 578", "incarne la trahison et la méchanceté (Nunkoro) ; symbole de l’adversité, qui triomphe des méchants (p. 557)"]], "jugFR": ["Fortuna major trouvée en la première maison donne une longue vie et délivre de l’importunité des maladies ; elle montre un homme noble, magnanime, de bonnes mœurs, de stature moyenne, de teint coloré, aux cheveux bouclés, et dont les membres supérieurs sont plus grands que les inférieurs.", "En la deuxième maison, elle signifie des richesses manifestes et un gain manifeste, la bonne fortune, et la récupération de toute chose perdue ou égarée ; la capture du voleur et le recouvrement des choses volées.", "En la troisième maison, elle signifie des frères et des parents nobles et de bonne fréquentation ; des voyages prospères et profitables, avec honneur ; elle montre des hommes fidèles et une amitié sans feinte.", "En la quatrième maison, elle représente un père noble, de bonne réputation, connu de beaucoup de gens ; elle accroît les possessions dans les villes, augmente les patrimoines et découvre les trésors cachés. En ce lieu, elle signifie aussi le vol, et fait recouvrer toute chose perdue.", "En la cinquième maison, elle donne de la joie par les enfants et les fait parvenir à de grands honneurs ; elle rend les ambassades prospères, mais elles s’obtiennent avec peine et prières ; elle indique que les rumeurs sont vraies ; elle accorde les honneurs publics et rend un homme très renommé après sa mort ; elle annonce qu’une femme enceinte mettra au monde un garçon.", "En la sixième maison, elle délivre des maladies ; elle montre que ceux qui sont malades guériront en peu de temps ; elle signifie un médecin fidèle et honnête, qui donnera de bons remèdes et dont on ne doit avoir aucun soupçon ; des domestiques et serviteurs fidèles ; et parmi les animaux, elle signifie surtout les chevaux.", "En la septième maison, elle donne une épouse riche, honnête et de bonnes mœurs, aimante et agréable ; elle surmonte les querelles et les procès. Mais si la question porte sur eux, elle signifie que les adversaires sont très puissants et en grande faveur.", "En la huitième maison, si l’on pose une question sur la mort de quelqu’un, elle signifie qu’il vivra ; elle montre une mort bonne et naturelle, une sépulture honnête et des funérailles honorables ; elle annonce qu’une épouse aura une riche dot, des legs et un héritage.", "En la neuvième maison, elle signifie des voyages prospères, par terre et à cheval plutôt qu’à pied, longs et non vite achevés ; elle montre le retour des absents ; elle signifie des hommes de bonne foi, constants dans leurs intentions, religieux, et qui ne changent ni n’altèrent jamais leur foi ; elle présage que les songes sont vrais ; elle signifie des sciences vraies et parfaites.", "En la dixième maison, elle annonce de grands honneurs, accorde les charges publiques, la magistrature et les judicatures, et les honneurs dans les cours des princes ; elle signifie des juges justes et non corrompus par les présents ; elle fait qu’une cause soit facilement et promptement expédiée ; elle montre des rois puissants, fortunés et victorieux ; elle dénote une victoire certaine ; elle signifie une mère noble et de longue vie.", "En la onzième maison, elle signifie des amis vrais et profitables ; un prince riche et libéral ; elle rend un homme fortuné et aimé de son prince.", "En la douzième maison, si l’on pose une question sur la qualité des ennemis, elle les montre puissants et nobles, et difficiles à combattre ; mais si la question porte sur quelque autre condition ou rapport aux ennemis, elle délivrera de leurs trahisons. Elle signifie des serviteurs fidèles ; elle ramène les fugitifs ; elle a signification d’animaux, comme chevaux, lions et taureaux ; elle délivre des emprisonnements ; et les dangers imminents, elle les atténue ou les écarte."], "jugEN": ["Fortuna major being found in the first House, gives long life, and freeth from the molestation of Diseases: it demonstrateth a man to be noble, magnanimous, of good manners, mean of stature, complexion ruddy, hair curling, and his superior members greater then his inferior.", "In the second House, he signifies manifest riches and manifest gain, good fortune, and the gaining of any thing lost or mis-laid; the taking of a thief, and recovery of things stolen.", "In the third House, he signifies brethren and kinsmen, Nobles, and persons of good conversation; journeys to be prosperous and gainful with honor: it demonstrateth men to be faithful, and their friendship to be unfeigned.", "In the fourth House, he represents a father to be noble, and of good reputation, and known by many people: He enlarges possessions in Cities, increases Patrimonies, and discovers hidden treasures. In this place he likewise signifies theft, and recovers every thing lost.", "In the fifth House, he gives joy by children, and causes them to attain to great Honors: Embassages he rendereth prosperous; but they are purchased with pains, and prayers: He notes rumors to be true: he bestows public Honors, and causes a man to be very famous after death: foresheweth a woman with child to bring forth a man-child.", "In the sixth House, he freeth from diseases; shows those that have infirmities shall in a short time recover; signifies a Physician to be faithful and honest to administer good Physic, of which there ought to be had no suspicion; housholdservants and ministers to be faithful: and of animals, he chiefly signifies Horses.", "In the seventh House, he gives a wife rich, honest, and of good manners; loving and pleasant: he overcomes strifes and contentions. But if the Question be concerning them, he signifies the adversaries to be very potent, and great favorites.", "In the eighth House, if a Question be proposed of the death of any one, it signifies he shall live: the kind of death he shows to be good and natural; an honest burial, and honorable Funerals: He foresheweth a wife to have a rich dowry, legacies and inheritance.", "In the ninth House, he signifies journeys to be prosperous; and by land on horseback, rather then on foot, to be long, and not soon accomplished: He shows the return of those that are absent; signifies men to be of good faith, and constant in their intentions; and religious; and that never change or alter their faith: Dreams he presageth to be true; signifies true and perfect Sciences.", "In the tenth House, he foresheweth great Honors, bestows public Offices, Magistracy, and Judgments; and honors in the Courts of Princes: signifies Judges to be just, and not corrupted with gifts: brings a Cause to be easily and soon expedited: shows Kings to be potent, fortunate, and victorious: denotes Victory to be certain: signifies a mother to be noble, and of long life.", "In the eleventh house, he signifies true friends, and profitable; a Prince rich and liberal; makes a man fortunate, and beloved of his Prince.", "In the twelfth House, if a Question be proposed of the quality of enemies, it demonstrateth them to be potent and noble, and hardly to be resisted: But if a Question shall be concerning any other condition or respect to the enemies, he will deliver from their treacheries. It signifies faithful servants; reduces fugitives; has signification of animals, as horses, lions, and bulls; freeth from imprisonments; and eminent dangers he either mitigateth or takes away."]}, {"n": 13, "rows": [1, 1, 1, 2], "zen": "Otba el kakhidja", "zenMaison": "Housseini — maison des renseignements divers", "elem": "eau et nord", "zod": "Bélier et Scorpion", "pla": "Mars — mercredi — fer", "arabe": "Utaba haraji (le seuil extérieur : de sortie)", "lat": "Cauda draconis (la queue du dragon)", "sis": "Laousina (El Hassan)", "lab": "Lassina", "kai": "Lusiné", "astro": "néant", "kaiMaison": "Siyoro so — maison des époux (foyer conjugal)", "kaiSigne": "Lusiné", "key": "cauda", "latin": "Cauda draconis", "fr": "la Queue du dragon", "ag": {"planete": "Queue du Dragon — suit sa propre nature", "signe": "Scorpion", "tripSignes": "eau", "tripNatures": "eau", "tripVulgaire": "feu", "zodiaque": "Capricorne"}, "ronecker": "", "qual": [["Agrippa", "donne le jugement contraire à Caput"]], "jugFR": null, "jugEN": null}, {"n": 14, "rows": [1, 2, 1, 1], "zen": "Naqi el khaddi", "zenMaison": "Iounous — maison des renseignements divers", "elem": "terre et ouest", "zod": "Taureau et Balance", "pla": "Vénus — vendredi — cuivre", "arabe": "Nakiya Liuda (l'imberbe, celui dont la force est pure)", "lat": "Puella (la fille)", "sis": "Djiné Moussa ou Ganian", "lab": "Ladari", "kai": "Tontigi", "astro": "néant", "kaiMaison": "Nafolo so — maison de la fortune, des biens", "kaiSigne": "Tontigi", "key": "puella", "latin": "Puella", "fr": "la Fille", "ag": {"planete": "Vénus — fortunée", "signe": "Taureau (la même phrase attribue aussi le Scorpion à « Puella and Rubeus »)", "tripSignes": "terre", "tripNatures": "air", "tripVulgaire": "eau", "zodiaque": "Cancer"}, "ronecker": "", "qual": [["Agrippa", "Vénus, fortunée"], ["Kassibo p. 559, 579", "figure redoutable (Tontigi) ; un des kèlè denw"]], "jugFR": ["Puella en la première maison signifie une personne de vie courte, de constitution faible, de stature moyenne, peu grasse, mais belle, efféminée et voluptueuse, et qui encourra au cours de sa vie de nombreux ennuis et dangers pour l’amour des femmes.", "En la deuxième maison, elle n’augmente pas les richesses et ne diminue pas la pauvreté ; elle signifie que le voleur n’a pas quitté la ville, et que la chose volée a été aliénée et écoulée ; si la question porte sur un trésor en un lieu, la réponse est qu’il n’y en a point.", "En la troisième maison, Puella signifie plus de sœurs que de frères, et accroît et maintient entre eux une bonne amitié ; elle dénote des voyages agréables et joyeux, et des hommes de bonne fréquentation.", "En la quatrième maison, Puella signifie un très petit patrimoine et un père qui ne vivra pas longtemps, mais elle rend les champs fertiles en bons fruits.", "En la cinquième maison, une femme enceinte est signifiée mettre au monde une fille ; elle ne dénote pas d’ambassades ; elle cause beaucoup de commerce avec les femmes, et fait obtenir d’elles quelque charge.", "Puella en la sixième maison signifie une grande faiblesse du malade, mais le fait guérir bientôt ; elle montre un médecin ignorant et malhabile, mais très estimé dans l’opinion du vulgaire ; elle donne de bons serviteurs, de bonnes servantes, du bétail et des animaux.", "En la septième maison, Puella donne une épouse belle, gracieuse et agréable, menant avec son mari une vie paisible et tranquille, et cependant qui brûlera fort de désir, et sera convoitée et désirée de beaucoup d’hommes ; elle ne dénote pas de procès pendants devant un juge, mais quelques chamailleries et disputes entre gens du peuple, qui seront aisément apaisées et terminées.", "En la huitième maison, si la question porte sur quelqu’un qu’on dit mort, Puella le déclare vivant ; elle donne une petite dot avec l’épouse, mais qui contente son mari.", "En la neuvième maison, Puella signifie très peu de voyages ; elle montre un homme de bonne religion, d’habileté ou de savoir moyen dans les sciences, sauf peut-être la musique, tant vocale qu’instrumentale.", "En la dixième maison, Puella signifie des princes peu puissants, mais qui gouverneront néanmoins paisiblement leurs domaines et seront aimés de leurs voisins et sujets ; elle les rend affables, doux et courtois, et fait qu’ils s’exerceront toujours à des réjouissances continuelles, des jeux et des chasses ; elle rend les juges bons, pieux et miséricordieux ; elle donne des charges touchant aux femmes, ou venant surtout de femmes nobles.", "En la onzième maison, Puella donne beaucoup d’amis et accroît la faveur auprès des femmes.", "En la douzième maison, Puella signifie peu d’ennemis, mais des querelles avec les femmes ; et elle délivre les prisonniers de prison par l’intercession d’amis."], "jugEN": ["Puella in the first House signifies a person of a short life, weak constitution of body, middle stature, little fat, but fair, effeminate and luxurious, and one who will incur many troubles and dangers in his ife-time for the love of women.", "In the second House, it neither increases riches, nor diminishes poverty; signifies a thief not to be departed from the City, and a thing stolen to be alienated and made away: if a Question be of treasure in a place, it is resolved there is none.", "In the third House Puella signifies more sisters then brethren, and increases and continues good friendship and amity amongst them; denotes journies to be pleasant and joyous, and men of good conversations.", "In the fourth House Puella signifies a very small patrimony, and a Father not to live long, but makes the fields fertile with good fruits.", "In the fifth House a woman with child is signified to bring forth a woman-child; denotes no Embassages, causes much commerce with women, and some office to be obtained from them.", "Puella in the sixth House signifies much weakness of the sick, but causes the sick shortly to recover; and shows a Physician to be both unlearned and unskilful, but one who is much esteemed of in the opinion of the vulgar people; gives good servants, handmaids, cattle and animals.", "In the seventh House Puella gives a wife fair, beautiful and pleasant, leading a peaceable and quiet conversation with her husband, notwithstanding one that shall burn much with lust, and be coveted and lusted after of many men; denotes no suits or controversies, which shall depend before a Judge, but some jarres and wranglings with the common people one amongst another, which shall be easily dissolved and ended.", "In the eighth House, if a Question be of one reputed to be dead, Puella declares him to be alive: gives a small portion with a wife, but that which contenteth her husband.", "In the ninth House Puella signifies very few journeys, shows a man of good religion, indifferent skill or knowledge in sciences, unless happily Music, as well vocal as instrumental.", "In the tenth House Puella signifies Princes not to be very potent, but notwithstanding they shall govern peaceably within their Dominions, and shall be beloved of their Neighbors and Subjects; it canseth them to be affable, mild and courteous, and that they shall always exercise themselves with continual mirth, plays, and huntings; makes Judges to be good, godly and merciful; gives Offices about women, or especially from noble women.", "In the eleventh House Puella gives many friends, and increases favor with women.", "In the twelfth House Puella signifies few enemies, but contention with women; and delivers Prisoners out of prison through the intercession of friends."]}, {"n": 15, "rows": [2, 1, 2, 1], "zen": "Gabda ed dakhel", "zenMaison": "Ousmani — maison du juge", "elem": "vent et sud", "zod": "Lion", "pla": "Soleil — dimanche — or", "arabe": "Habula dahili (la poignée entrante)", "lat": "Acquisito (le gain)", "sis": "Ansoumane", "lab": "Ousmane", "kai": "Mori Zumana", "astro": "néant", "kaiMaison": "Kéné so — maison de la connaissance, de la clarté", "kaiSigne": "Mori Soumana", "key": "acquisitio", "latin": "Acquisitio", "fr": "le Gain", "ag": {"planete": "Jupiter — Jupiter grande Fortune", "signe": "Poissons", "tripSignes": "eau", "tripNatures": "eau", "tripVulgaire": "air", "zodiaque": "Bélier"}, "ronecker": "", "qual": [["Agrippa", "Jupiter grande Fortune"]], "jugFR": ["Acquisitio trouvée en la première maison donne une longue vie et une vieillesse prospère ; elle signifie un homme de stature moyenne, à la grosse tête, au visage très reconnaissable, au long nez, à la barbe abondante, aux cheveux bouclés et aux beaux yeux, généreux pour le boire et le manger, mais en tout le reste regardant et peu libéral.", "En la deuxième maison, elle signifie de très grandes richesses, fait arrêter tous les voleurs et fait recouvrer tout ce qui est perdu.", "En la troisième maison : beaucoup de frères, et riches ; beaucoup de voyages profitables ; elle signifie un homme de bonne foi.", "En la quatrième est signifié un patrimoine très riche, de nombreuses possessions aux fruits abondants ; elle signifie que le trésor caché en quelque lieu sera trouvé ; et montre un père riche, mais avare.", "En la cinquième maison, Acquisitio signifie beaucoup d’enfants des deux sexes, mais plus de garçons que de filles ; elle montre qu’une femme est enceinte et qu’elle accouchera sans danger ; et si l’on pose une question sur un sexe, elle signifie qu’il est masculin ; elle accroît les ambassades et messages profitables, mais n’étend pas loin la renommée après la mort ; elle fait cependant qu’un homme hérite des siens, et signifie que les rumeurs sont vraies.", "En la sixième maison, elle signifie des maladies nombreuses et graves, et de longue durée ; elle met le malade en danger de mort, et souvent il meurt ; elle déclare cependant un médecin savant et honnête ; elle donne beaucoup de serviteurs et de bétail, et des gains à en tirer.", "En la septième maison, elle signifie une épouse riche, mais soit veuve, soit d’un âge mûr ; elle signifie des procès et querelles grands et durables, et que l’amour et le mariage se feront par le sort.", "En la huitième maison, si l’on s’enquiert d’un homme, elle le montre mort ; elle signifie une mort brève, et une maladie qui ne dure que peu de jours ; elle découvre des legs et héritages très profitables, et signifie qu’une épouse aura une riche dot.", "En la neuvième maison, elle signifie des voyages longs et profitables ; elle montre que si quelqu’un est absent il reviendra bientôt ; elle fait obtenir un gain des personnes religieuses et ecclésiastiques ou des lettrés, et signifie un homme d’une science vraie et parfaite.", "En la dixième maison, elle fait que les princes agrandissent leurs domaines ; un juge favorable, mais à qui il faut sans cesse faire des présents ; elle rend les charges et la magistrature très lucratives ; elle signifie une mère riche et heureuse.", "En la onzième maison, Acquisitio multiplie les amis, en fait tirer profit, et accroît la faveur auprès des princes.", "En la douzième maison, elle signifie qu’un homme aura beaucoup d’ennemis forts ou puissants ; elle ramène les serviteurs enfuis et le bétail égaré ; et signifie que celui qui est en prison ne sera pas délivré."], "jugEN": ["in the first House, gives a long life and prosperous old age; signifies a man of a middle stature, and a great head, a countenance very well to be distinguished or known, a long nose, much beard, hair curling, and fair eyes, free of his meat and drink, but in all things else sparing and not liberal.", "In the second House, he signifies very great riches, apprehends all thieves, and causes whatsoever is lost to be recovered.", "In the third House, many brethren, and they to be wealthy; many gainful journies; signifies a man of good faith.", "In the fourth is signified a Patrimony of much riches, many possessions of copious fruits; he signifies that treasure hid in any place shall be found; and shows a Father to be rich, but covetous.", "In the fifth House, Acquisitio signifies many children of both Sexes, but more Males then Females; shows a woman to be with child, and that she shall be delivered without danger: and if a question be propounded concerning any Sex, he signifies it to be Masculine; increases gainful profitable Embassages and Messages, but extends fame not far after death, yet causes a man to be inherited of his own, and signifies rumors to be true.", "In the sixth House he signifies many and grievous sicknesses, and long to continue, makes the sick to be in danger of death, and often to die: yet he declares a Physician to be learned and honest; gives many servants and chattel, and gains to be acquired from them.", "In the seventh House he signifies a wife to be rich, but either a widow, or a woman of a well-grown age; signifies suits and contentions to be great and durable, and that love and wedlock shall be effected by lot.", "In the eighth House, if a man he enquired after, it shows him to be dead, signifies the kind of death to be short, and sickness to last but a few days; discovers very profitable legacies and inheritances, and signifies a wife to have a rich dowry.", "In the minth House he signifies long and profitable journeys; shows if any one be absent he shall soon return; causes gain to be obtained from Religious and Ecclesiastical Persons or Scholars, and signifies a man of a true and perfect Science.", "In the tenth House, he makes Princes to enlarge their Dominions; a Judge favorable, but one that must be continually presented with gifts; causes Offices and Magistracy to be very gainful; signifies a Mother rich and happy.", "In the eleventh House, Acquisitio multiplieth friends, and brings profit from them, and increases favor with Princes.", "In the twelfth House he signifies a man shall have many powerful or potent enemies; reduces and brings home servants fled away, and cattle strayed; and signifies he that is in prison shall not be delivered."]}, {"n": 16, "rows": [2, 2, 2, 2], "zen": "Al Djemaa", "zenMaison": "Moussa — maison des nouvelles de toute nature", "elem": "feu et est", "zod": "Vierge et Gémeaux", "pla": "Mercure — mercredi — vif argent", "arabe": "Jamaa al Jamaa (l'assemblée, la foule)", "lat": "Populus (le peuple)", "sis": "Siké", "lab": "Moussa", "kai": "Jamati Moussa", "astro": "néant", "kaiMaison": "Laban so — maison de la fin", "kaiSigne": "Jamati Moussa", "key": "populus", "latin": "Populus", "fr": "le Peuple (la Foule)", "ag": {"planete": "Lune — depuis sa pleine lumière et son dernier quartier", "signe": "Cancer", "tripSignes": "eau", "tripNatures": "eau", "tripVulgaire": "eau", "zodiaque": "Verseau"}, "ronecker": "La Foule, l’une des quatre figures Mères qui ne s’inversent pas : multiple, gouvernée par le pair, illimitée, inconstante et mouvante ; image du Monde du tarot, elle unifie et uniformise. Dessin « Multiple » (p. 23).", "qual": [["Agrippa", "Lune (aucune qualité dite)"], ["Kassibo p. 560", "archétype des quinze autres figures"]], "jugFR": ["Populus trouvé en la première maison, si la question porte sur cette maison, montre une vie moyenne, d’âge moyen, mais inconstante, avec diverses maladies et des succès de fortune variés ; il signifie un homme de stature moyenne, au corps épais, bien bâti de ses membres ; peut-être un grain de beauté ou une marque près de l’œil gauche. Mais si la question porte sur la figure (l’apparence) d’un homme, et qu’à cette figure soit jointe l’une des figures de Saturne ou Rubeus, il montre que l’homme est monstrueusement difforme, et que cette difformité vient de sa naissance ; mais en la cinquième maison, s’il est entouré d’aspects malveillants, cette monstruosité est à venir.", "En la deuxième maison, Populus montre un avoir médiocre, et acquis avec grande difficulté ; il rend aussi un homme toujours sensible au labeur pénible ; les choses volées ne sont jamais regagnées ; ce qui est perdu ne sera jamais entièrement recouvré ; ce qui est caché ne sera pas trouvé. Mais si la question porte sur un voleur, il le déclare non encore enfui, mais caché dans la ville.", "En la troisième maison, Populus suscite peu d’amis, que ce soit parmi les frères ou la parenté ; il annonce des voyages, mais avec peine et trouble ; néanmoins quelque profit peut en revenir ; il dénote un homme instable dans sa foi, et fait qu’on est souvent trompé par ses compagnons.", "En la quatrième maison, il signifie un père maladif et de vie laborieuse, et que ses possessions terrestres et héritages lui seront ôtés ; il montre un profit à tirer de l’eau ; il montre qu’il n’y a pas de trésor caché, ou s’il y en a, qu’il ne sera pas trouvé ; un patrimoine conservé avec grande peine.", "En la cinquième maison, il ne montre pas de messages honnêtes, mais fait des messagers des portefaix ou des voituriers publics ; il répand de fausses rumeurs qui ont cependant quelque apparence de vérité et semblent tirer leur origine du vrai, mais qui ne sont pas rapportées comme les choses se sont passées. Il signifie une femme stérile et fait avorter celles qui sont grosses ; il assigne des funérailles sans gloire et une mauvaise réputation après la mort.", "En la sixième maison, Populus montre des maladies froides, et affecte surtout les parties basses du corps ; le médecin est déclaré négligent et sans soin dans l’administration des remèdes au malade ; il signifie que ceux qui sont atteints de maladie sont en danger de mort et ne guériront guère ; il note la tromperie des serviteurs et le dommage du bétail.", "En la septième maison, il montre une épouse belle et agréable, mais qui sera sollicitée par l’amour de nombreux prétendants ; il signifie que ses amours sont feintes et dissimulées ; il fait que des adversaires faibles et impuissants renoncent bientôt aux poursuites.", "En la huitième maison, il dénote une mort soudaine sans longue maladie ni angoisse, et montre souvent la mort par l’eau ; il ne donne ni héritage, ni possession, ni legs des morts ; et s’il y en a, ils seront perdus par quelque contestation ou autre discorde survenante ; il signifie que la dot d’une épouse sera petite ou nulle.", "Populus en la neuvième maison montre des songes faux ; il représente un homme d’esprit grossier, sans instruction ni science ; en religion, il signifie les offices inférieurs, comme ceux qui servent à nettoyer l’église ou à sonner les cloches ; et il signifie un homme peu curieux ou peu studieux en religion, et peu troublé par la conscience.", "En la dixième maison, il signifie des rois et des princes qui, pour la plupart, sont chassés de leur gouvernement et de leurs domaines, ou qui souffrent continuellement trouble et dommage autour d’eux ; il signifie des charges et magistratures qui touchent aux affaires des eaux, comme la marine, les ponts, les pêcheries, les rivages, les prairies et choses semblables ; il rend les juges changeants et lents à expédier les causes ; il déclare une mère maladive et de courte vie.", "En la onzième maison, il donne peu d’amis et beaucoup de flatteurs ; et auprès des princes il ne donne ni faveur ni fortune.", "En la douzième maison, il montre des ennemis faibles et sans noblesse ; il déclare que le prisonnier ne sera pas délivré ; il découvre des dangers dans les eaux et les lieux aquatiques."], "jugEN": ["Populus being found in the first House, if a Question be propounded concerning that House, shows a mean life, of a middle age, but inconstant, with diverse sicknesses, and various successes of Fortune: signifies a man of a middle stature, a gross body, well set in his members; perhaps some mold or mark about his left eye. But if a Question shall be propounded concerning the figure of a man, and to this figure if there be joined any of the figures of Saturn or Rubeus, it shows the man to be monstrously deformed; and that deformity he signifies to proceed from his birth: but if", "In the second House, Populus shows a mean substance, and that to be gotten with great difficulty: makes a man also always sensible of laborious toil: things stolen are never regained: what is lost shall never be wholly recovered: that which is hidden shall not be found. But if the Question be of a thief, it declares him not yet to be fled away, but to lie lurking within the City.", "In the third House, Populus raises few friends, either of brethren or kindred: foresheweth journeys, but with labor and trouble; notwithstanding some profit may accrue by them: denotes a man unstable in his faith, and causes a man often to be deceived by his companions.", "In the fourth House, it signifies a father to be sickly, and of a laborious life, and his earthly possessions and inheritances to be taken away shows profit to be gained by water: shows treasure not to be hid; or if there be any hidden, that it shall not be found: A patrimony to be preserved with great labor.", "in the fifth House, if he be encompas^ed with malevolent Aspects, then that monstrousness is to come. In the fifth House, he shows no honest Messages, but either makes the messengers to be Porters, or public Carryers: he di^^lgeth false rumors, which notwithstanding have the likeness of some truth, and seem to have their original from truth, which is not reported as it is done: It signifies a woman to be barren, and causes such as are great with child to be abortives: appoints an inglorious Funeral, and ill report after death.", "In the sixth House, Populus shows cold sicknesses; and chiefly affects the lower parts of the body: A Physician is declared to be careless and negligent in administering Physic to the sick, and signifies those that are affected with sickness to be in danger of death, and scarcely recover at all: it notes the decitfulness of servants, and detriment of cattle.", "In the seventh House, it shows a wife to be fair and pleasant, but one that shall be solicited with the love of many wooers: signifies her loves to be feigned and dissembling: makes weak and impotent adversaries soon to desert prosecuting.", "In the eighth House, it denotes sudden death without any long sickness or anguish, and oftentimes shows death by the water; gives no inheritance, possession or legacy from the dead; and if any be, they shall be lost by some intervening contention, or other discord: he signifies the dowry of a wife to be little or none.", "Populus in the ninth House, sneweth false dreams, personates a man of rude wit, without any learning or science; In religion he signifies infericur Offices, such as serve either to cleanse the Church, or ring the bells; and he signifies a man little curious or studious in religion, neither one that is troubled with much conscience.", "In the tenth House he signifies such Kings and Princes, as for the most part are expulsed out of their Rule and Dominions, or either suffer continual trouble and detriment about them: he signifies Offices and Magistracy, which appertain to matters concerning the waters, as about the Navy, bridges, fishings, shores, meadows, and things of the like sort; makes Judges to be variable and slow in expediting of Causes before them; declares a Mother to be sickly, and of a short life.", "In the eleventh House he gives few friends, and many flatterers; and with Princes gives neither favor nor fortune.", "In the twelfth House he shows weak and ignoble enemies; declares one in prison not to be delivered; discovers dangers in waters, and watery places."]}];
const AG_MAISONS={"fr": ["La première maison montre la personne du consultant, chaque fois qu’une question est posée sur lui-même, sur ses propres affaires, ou sur quelque chose qui lui appartient. Cette maison déclare le jugement de la vie, de la forme, de l’état, de la condition, de l’habitude, de la disposition, de la forme et de la figure, et du teint des hommes.", "La deuxième maison contient le jugement de l’avoir, des richesses, de la pauvreté, du gain et de la perte, de la bonne et de la mauvaise fortune, et des accidents survenant à l’avoir, comme le vol, la perte ou la négligence.", "La troisième maison signifie les frères, les sœurs et les collatéraux par le sang ; elle juge des petits voyages et de la fidélité des hommes.", "La quatrième maison signifie les pères et grands-pères, le patrimoine et l’héritage, les possessions, les bâtiments, les champs, les trésors et les choses cachées ; elle donne aussi la description de ceux à qui il manque quelque chose par vol, perte ou négligence.", "La cinquième maison donne le jugement des légats, des messagers, des rumeurs, des nouvelles, de l’honneur et des accidents après la mort, et des questions qu’on peut poser sur les femmes enceintes ou les créatures pleines.", "La sixième maison donne le jugement des infirmités et des remèdes, des familiers et des serviteurs, du bétail et des animaux domestiques.", "La septième maison signifie le mariage, la débauche et la fornication ; elle rend le jugement des amis, des querelles et des différends, et des affaires traitées devant les juges.", "La huitième a signification de la mort, des choses qui viennent par la mort, des legs et des biens héréditaires, de la dot ou de la part d’une épouse.", "La neuvième maison montre les voyages, la foi et la constance, les songes, les sciences divines et la religion.", "La dixième maison a signification des honneurs et des charges de magistrature.", "La onzième maison signifie les amis et l’avoir des princes.", "La douzième maison signifie les ennemis, les serviteurs, l’emprisonnement et l’infortune, et tout le mal qui peut arriver hors la mort et la maladie, dont les jugements sont à chercher en la sixième maison et en la huitième."], "en": ["The first House shows the person of the Querent, as often as a Question shall be proposed concerning himself of his own matters, or any thing appertaining to him. And this House declares the Judgment of the life, form, state, condition, habit, disposition, form and figure, and of the color of men.", "The second House contains the Judgment of substance, riches, poverty, gain and loss, good fortune and evil fortune: and of accidents in substance; as theft, loss or negligence.", "The third House signifies brethren, sisters, and Collaterals in blood: It judges of small journeys, and fidelities of men.", "The fourth House signifies fathers and grandfathers, patrimony and inheritance, possessions, buildings, fields, treasure, and things hidden: It gives also the description of those who want any thing by theft, losing, or negligence.", "The fifth House gives judgment of Legates, Messengers, Rumors, News; of Honor, and of accidents after death: and of Questions that may be propounded concernning women with child, or creatures pregnant.", "The sixth House gives Judgment of infirmities, and medicines; of familiars and servants; of cattle and domestic animals.", "The seventh House signifies wedlock, whoredom, and fornica ion; renders Judgment of friends, strifes, and controversies; and of matters acted before Judges.", "The eighth has signification of death, and of those things which come by death of Legates, and hereditaments; of the dowry or portion of a wife.", "The ninth House shows journeys, faith, and constancy; dreams, divine Sciences, and Religion.", "The tenth House has signification of Honors, and of Magisterial Offices.", "The eleventh House signifies friends, and the substance of Princes.", "The twelfth House signifies enemies, servants, imprisonment, and misfortune, and whatsoever evil can happen besides death and sickness, the Judgments whereof are to be required in the sixth House, and in the eighth."]};
const AG_GENERAL=[{"id": "intro", "titre": "Ce qu’est la géomancie", "fr": "La géomancie est un art de divination par lequel le jugement peut être rendu, par sort ou par destin, sur toute question de toute chose ; mais l’art consiste surtout en certains points d’où l’on tire certaines figures selon la raison ou la règle de l’égalité ou de l’inégalité, de la ressemblance ou de la dissemblance ; ces figures sont aussi rapportées aux figures célestes, dont elles prennent les natures et les propriétés, selon le cours et les formes des signes et des planètes. Il faut toutefois considérer d’abord que cet art ne peut rien déclarer ni montrer de vrai s’il n’est enraciné dans quelque vertu sublime, et les auteurs de cette science l’ont démontrée double. L’une consiste en la religion et les cérémonies : c’est pourquoi ils veulent que les projections des points de cet art se fassent par des signes dans la terre, et cet art est ainsi approprié à l’élément de la Terre, comme la pyromancie au feu et l’hydromancie à l’eau. Et comme ils jugeaient que la main du projecteur, c’est-à-dire de l’opérateur, était mue et dirigée le plus puissamment vers les esprits terrestres, ils usaient d’abord de certaines incantations et prières saintes, avec d’autres rites et observances, pour provoquer et attirer les esprits de cette nature.\n\nIl y a une autre puissance qui dirige et gouverne ce sort ou cette fortune : elle est dans l’âme même du projecteur, lorsqu’il est porté à cette œuvre par un grand élan de son propre désir ; car cet art a une obéissance naturelle à l’âme elle-même, a nécessairement de l’efficacité, et se meut vers ce que l’âme elle-même désire ; et cette voie est de loin la plus vraie et la plus pure. Peu importe où et comment ces points sont projetés ; aussi cet art a-t-il la même racine que l’art des questions astrologiques, qui ne peut non plus être vérifié autrement que par une affection constante et excessive du consultant lui-même. Pour passer à la pratique de cet art, il faut d’abord savoir que toutes les figures sur lesquelles l’art entier est fondé ne sont que seize, comme vous le verrez noté dans la table suivante, avec leurs noms.", "en": "GEOMANCY is an Art of Divination, whereby the judgment may be rendered by lot, or destiny, to every question of every thing whatsoever, but the Art hereof consists especially in certain points whereof certain figures are deducted according to the reason or rule of equality or inequality, likeness or unlikenesse; which Figures are also reduced to the Celestial Figures, assuming their natures and proprieties, according to the course and forms of the Signs and Planets; notwithstanding this in the first place we are to consider, that whereas this kind of Art can declare or show forth nothing of verity, unless it shall be radical in some sublime virtue, and this the Authors of this Science have demonstrated to be twofold: the one whereof consists in Religion and Ceremonies; and therefore they will have the Projectings of the points of this Art to be made with signs in the Earth, wherefore this Art is appropriated to this Element of Earth, even as Pyromancy to the fire, and Hydromancy to the Element of Water: Then whereas they judged the hand of the Projector or Worker to be most powerfully moved, and directed to the terrestrial spirits; and therefore they first used certain holy incantations and deprecations, with other rites and observations, provoking and alluring spirits of this nature hereunto.\n\nAnother power there is that does direct and rule this Lot or Fortune, which is in the very soul it self of the Projector, when he is carried to this work with some great egresse of his own desire, for this Art has a natural obedience to the soul it self, and of necessity iath efficacy and is moved to that which the soul it self desires, and this way is by far more true and pure; neither matters it where or how these points are projected; therefore this Art has the same Radix with the Art of Astrologicall Questions: which also can no otherwise be verified, unless with a constant and excessive affection of the Querent himself: Now then that we may proceed to the Praxis of this Art; first it is to be known, that all Figures upon which this whole Art is founded are only sixteen, as in this following Table you shall see noted, with their names."}, {"id": "planetes", "titre": "Les figures et les planètes", "fr": "Nous déclarons maintenant à quelles planètes ces figures sont distribuées, car de là dépendent toute la propriété et la nature des figures, et le jugement de tout l’art. La grande et la petite Fortune sont attribuées au Soleil ; la première, la grande Fortune, quand le Soleil est diurne et placé dans ses dignités ; l’autre, la petite Fortune, quand le Soleil est nocturne ou placé dans des dignités moindres. Via et Populus (c’est-à-dire le Chemin et le Peuple) se rapportent à la Lune : la première depuis son commencement et sa croissance, la seconde depuis sa pleine lumière et son dernier quartier. Acquisitio et Laetitia (c’est-à-dire Gain, Profit ; Joie et Allégresse) sont de Jupiter : la première a Jupiter grande Fortune, la seconde moindre, mais sans détriment. Puella et Amissio sont de Vénus : la première fortunée, l’autre comme rétrograde ou combuste. Conjunctio et Albus sont toutes deux des figures de Mercure, et toutes deux bonnes, mais la première plus fortunée. Puer et Rubeus sont des figures attribuées à Mars : la première a Mars bienveillant, la seconde malveillant. Carcer et Tristitia sont toutes deux des figures de Saturne, et toutes deux mauvaises, mais la première de plus grand détriment. La Tête et la Queue du Dragon suivent leur propre nature.", "note": "Le texte imprimé de 1655 porte des coquilles : « Kenus » pour Vénus, « Carter » pour Carcer, « Sataru » pour Saturne ; la table qui précède porte « Cancer » et « Alous » à la place de Carcer et Albus.", "en": "Now we proceed to declare with what Planets these Figures are distributed; for hereupon all the propriety and nature of Figures and the judgment of the whole Art depends: Therefore the greater and lesser Fortune are ascribed to the Sun; but the first or greater Fortune is when the Sun is diurnall, and posited in his dignities; the other, or lesser Fortune is when the Sun is nocturnall, or placed in less dignities: Via, and Populus (that is, the Way, and People) are referred to the Moon; the first from her beginning and increasing, the second from her full light and quarter decreasing; Acquisitio, and Laetitia (which is Gain, Profit; Joy and Gladness) are of Jupiter: But the first has Jupiter the greater Fortune, the second the less, but without detriment: Puella, and Amissio are of Kenus; the first fortunate, the other (as it were) rettograde, or combust: Conjunctio and Albus are both Figures of Mercury, and are both good; but the first the more Fortunate: Puer, and Rubius are Figures ascribed to Mars; the first whereof has Mars benevolent, the second malevolent: Carter, and Tristitia are both. Figures of Sataru, and both evil; but the first of the greater detriment: the Dragons head, and Dragons tail do follow their own natures."}, {"id": "signes", "titre": "Les figures et les signes du zodiaque", "fr": "Ce sont là les comparaisons infaillibles des figures, et l’on peut aisément en discerner l’égalité de leurs signes. La grande et la petite Fortune ont le signe du Lion, maison du Soleil ; Via et Populus ont le signe du Cancer, maison de la Lune ; Acquisitio a pour signe les Poissons, et Laetitia le Sagittaire, toutes deux maisons de Jupiter ; Puella a le signe du Taureau, et Amissio celui de la Balance, maisons de Vénus ; Conjunctio a pour signe la Vierge, et Albus les Gémeaux, maisons de Mercure ; Puella [sic] et Rubeus ont pour signe le Scorpion, maison de Mars ; Carcer a le Capricorne, et Tristitia le Verseau, maisons de Saturne. La Tête et la Queue du Dragon se partagent ainsi : la tête au Capricorne, et la queue du Dragon s’attache au Scorpion. De là vous pouvez aisément obtenir les triplicités de ces signes à la manière des triplicités des signes du zodiaque : Puer, les deux Fortunes et Laetitia gouvernent la triplicité de feu ; Puella, Conjunctio, Carcer et la Tête du Dragon la triplicité de terre ; Albus, Amissio et Tristitia font la triplicité d’air ; Via, Populus et Rubeus, avec la Queue du Dragon et Acquisitio, gouvernent la triplicité d’eau ; et cet ordre est pris selon le cours ou la manière des signes.", "note": "Le texte imprimé porte « Puella and Rubeus have for their sign Scorpio », alors que Puella vient d’être attribuée au Taureau dans la même phrase ; il porte aussi « Amitia » pour Amissio. Ces mots sont reproduits tels quels.", "en": "And these are the infallible comparisons of the Figures, and from these we may easily discern the equality of their signs; therefore the greater and lesser Fortunes have the signs of Leo, which is the House of the Sun: Via and Populus have the sign of Cancer, which is the House of the Moon: Acquisitio has for his sign Pisces; and Laetitia Sagitary, which are both the Houses of Jupiter: Puella has the sign of Taurus, and Amissio of Libra, which are the Houses of Venus: Conjunctio has for its sign Virgo, and Albus the sign Gemini, the Houses of Mercury: Puella and Rubeus have for their sign Scorpio, the House of Mars: Carcer has the sign Capricorn, and Tristitia Aquary, the Houses of Saturn: The Dragons head and tail are thus divided, the head to Capricorn, and the Dragons tail adhereth to Scorpio; and from hence you may easily obtain the triplicities of these signs after the manner of the triplicities of the signs of the Zodiac: Puer therefore, both Fortunes, and Latitia do govern the fiery triplicity; Puella, Conjunctio, Carcer, and the Dragons head the earthly triplicity: Albus, Amitia, and Tristitia, do make the Airy triplicity: and Via, Populus, and Rubeus, with the Dragons tail, and Acquisitio do rule the watery triplicity, and this order is taken according to the course or manner of the signs."}, {"id": "triplicites", "titre": "Les triplicités selon la nature des planètes, et l’ordre vulgaire", "fr": "Mais si l’on veut constituer ces triplicités selon les natures des planètes et des figures elles-mêmes, qu’on observe cette règle : Fortuna major, Rubeus, Puer et Amissio font la triplicité de feu ; Fortuna minor, Puella, Laetitia et Conjunctio la triplicité d’air ; Acquisitio, la Queue du Dragon, Via et Populus gouvernent la triplicité d’eau ; et la triplicité de terre est gouvernée par Carcer, Tristitia, Albus et la Tête du Dragon. Et cette voie est plutôt à observer que la première que nous avons exposée, parce qu’elle est constituée selon la règle et la manière des signes.\n\nCet ordre est aussi bien plus vrai et plus rationnel que celui qu’on emploie vulgairement, qui se décrit ainsi : de la triplicité de feu sont Cauda, Fortuna minor, Amissio et Rubeus ; de la triplicité d’air, Acquisitio, Laetitia, Puer et Conjunctio ; de la triplicité d’eau, Populus, Via, Albus et Puella ; et Caput, Fortuna major, Carcer et Tristitia sont de la triplicité de terre.", "en": "But if any one will constitute these triplicities according to the natures of the Planets, and Figures themselves, let him observe this Rule, that Fortuna major, Rubeus, Puer, and Amissio do make the fiery triplicity: Fortuna minor, Puella, Latitia, and Conjunctio triplicity of the Air: Acquisitio, the Dragons tail, Via, and Populus do govern the watery triplicity; and the earthly triplicity is ruled by Carcer, Tristitia, Albus, and the Dragons head. And this way is rather to be observed then the first which we have set forth; because it is constituted according to the Rule and manner of the signs.\n\nThis order is also far more true and rational then that which vulgarly is used, which is described after this manner: of the Fiery triplicity are, Cauda, Fortuna minor, Amissio, and Rubeus: of the Airy triplicity are, Acquisitio, Laetitia, Puer, and Conjunctio: of the watery triplicity are, Populus, Via, Albus, and Puella: And Caput, Fortuna major, Carcer, and Tristitia are of the earthly triplicity."}, {"id": "zodiaque", "titre": "Distribution des figures aux douze signes", "fr": "On distribue aussi ces figures aux douze signes du zodiaque de cette manière : Acquisitio est donnée au Bélier ; la Fortune, majeure et mineure, au Taureau ; Laetitia au signe des Gémeaux ; Puella et Rubeus au Cancer ; Albus est assigné au Lion, Via à la Vierge ; la Tête du Dragon et Conjunctio à la Balance ; Puer est soumis au Scorpion ; Tristitia et Amissio sont assignées au Sagittaire ; la Queue du Dragon au Capricorne ; Populus au Verseau ; et Carcer est assigné au signe des Poissons.", "en": "They do likewise distribute these Figures to the twelve signs of the Zodiac, after this manner, Acquisitio is given to Aries; Fortuna, both major and minor to Taurus; Latitia to the sign Gemini; Puella and Rubens to Cancer; Albus is assigned to Leo, Via to Virgo; the Dragons head, and Conjunctio to Libra; Puer is submitted to Scorpio; Tristitia and Amissio are assigned to Sagitary; the Dragons tail to Capricorn; Populus to Aquarius; and Carcer is assigned the sign Pisces."}, {"id": "projection", "titre": "La manière de projeter les points et d’établir le thème", "fr": "Venons-en à la manière de projeter ou de poser ces figures : on pose les points selon leur cours en quatre lignes, de la main droite vers la gauche, et cela en quatre fois. Il en résulte quatre figures faites de quatre lignes chacune, selon que chaque ligne est marquée paire ou impaire ; ces quatre figures sont d’ordinaire appelées Matres (Mères) ; elles engendrent les autres et remplissent et complètent toute la figure du jugement.\n\nDe ces quatre Mères sont aussi produites quatre autres figures secondes, qu’on appelle Filiae (Filles) ou Succédentes, qu’on rassemble de cette manière : en plaçant les quatre Mères selon leur ordre, l’une après l’autre ; ce qui résulte de chaque ligne fait une figure des Filles, dont l’ordre se prend en descendant des points supérieurs, à travers les deux [lignes intermédiaires], jusqu’aux plus bas.\n\nEt ces huit figures font huit maisons du ciel, de cette manière, en plaçant les figures de la main gauche vers la droite : comme les quatre Mères font les quatre premières maisons, les quatre Filles font les quatre suivantes, c’est-à-dire la cinquième, la sixième, la septième et la huitième ; et le reste des maisons se trouve ainsi : de la première et de la deuxième se tire la neuvième ; de la troisième et de la quatrième, la dixième ; de la cinquième et de la sixième, la onzième ; et de la septième et de la huitième, la douzième ; par la combinaison ou la jonction de deux figures selon la règle du nombre pair ou impair des points restants de chaque figure. De la même manière sont produites, à partir des quatre dernières figures, c’est-à-dire de la neuvième, dixième, onzième et douzième, deux figures qu’on appelle Coadjutrices ou Témoins ; de ces deux, on en constitue aussi une, qu’on appelle l’Index (le Juge) de toute la figure, ou de la chose demandée.", "en": "And now we come to speak of the manner of projecting or setting down these Figures, which is thus; that we set down the points according to their course in four lines, from the right hand toward the left, and this in four courses: There will therefore result unto us four Figures made in four several lines, according to the even or uneven marking every several line; which four Figures are wont to be called Matres: which do bring forth the rest, filling up and completing the whole Figure of Judgment, an example whereof you may see here following.\n\nOf these four Matres are also produced four other secondary Figures, which they call Fili, or Succedents, which are gathered together after this manner; that is to say, by making the four Matres according to their order, placing them by course one after another (...); then that which shall result out of every line, makes the Figure of Fili, the order whereof is by discending from the superior points through both (...) to the lowest: as in this example.\n\nMatres.\n\nFiliae produced.\n\nAnd these 8 Figures do make 8 Houses of Heaven, after this manner, by placing the Figures from the left hand toward the right: as the four Matres do make the four first Houses, so the four Filia do make the four following Houses, which are the fifth, sixth, seventh, and eighth: and the rest of the Houses are found after this manner; that is to say, out of the first and second is derived the ninth; out of the third and fourth the tenth; out of the fifth and sixth the eleventh; and out of the seventh and eighth the twelfth: By the combination or joining together of two Figures according to the rule of the even or uneven number in the remaining points of each Figure. After the same manner there are produced out of the last four Figures; that is to say, of the ninth, tenth, eleventh, and twelfth, two Figures which they call Coadjutrices, or Testes; out of which two is also one constituted, which is called the Index of the whole Figure, or thing Quesited: as appears in this example following."}, {"id": "vraiefigure", "titre": "La « vraie figure » selon la raison astrologique", "fr": "Ce que nous avons exposé est la manière commune observée par les géomanciens, que nous ne rejetons ni n’exaltons entièrement ; il faut donc aussi en tenir compte dans nos jugements. Je vous donnerai maintenant la vraie figure de géomancie, selon la juste constitution de la raison astrologique, qui est celle-ci.\n\nComme les Mères susdites font les quatre angles d’une maison [du ciel], la première fait le premier angle, la deuxième le deuxième angle, la troisième le troisième angle, et la quatrième le quatrième angle ; de même les quatre Filles, nées des Mères, constituent les quatre maisons succédentes : la première fait la deuxième maison, la deuxième la onzième, la troisième la huitième, et la quatrième fait la première maison [sic] ; les autres maisons, qui sont cadentes, se calculent selon la règle de leur triplicité, c’est-à-dire en faisant la neuvième à partir de la quatrième et de la cinquième, la sixième à partir de la dixième et de la deuxième, la troisième de la septième et de la onzième, et la douzième de la quatrième et de la huitième.\n\nVous avez maintenant toute la figure du vrai jugement, constituée selon des raisons vraies et efficaces, et je vous montrerai comment l’achever : la figure qui sera en la première maison vous donnera le signe ascendant, que montre la première figure ; cela fait, vous attribuerez leurs signes aux autres maisons selon l’ordre des signes ; puis dans chaque maison vous noterez les planètes selon la nature de la figure ; puis de tout cela vous bâtirez votre jugement selon la signification des planètes dans les signes et maisons où elles se trouveront, selon leurs aspects entre elles, et selon le lieu du consultant et de la chose demandée ; et vous jugerez selon les natures des signes ascendants en leurs maisons, selon les natures et propriétés des figures qu’ils ont placées dans les diverses maisons, et selon le mélange des autres figures qui les regardent.", "note": "Point ambigu : le texte imprimé dit que la quatrième Fille « fait la première maison », alors que la première maison est déjà donnée à la première Mère ; les maisons succédentes sont II, V, VIII et XI. Le calcul des cadentes mêle aussi des numéros de Mères et de maisons. L’appli ne calcule donc pas cette disposition et la donne seulement à lire.", "en": "And this which we have declared is the common manner observed by Geomancers, which we do not altogether reject neither extol; therefore this is also to be considered in our judgments: Now therefore I shall give unto you the true Figure of Geomancy, according to the right constitution of Astrologicall reason, which is thus.\n\nAs the former Matres do make the four Angles of an House, the first makes the first Angle, the second the second Angle, the third makes the third Angle, and the fourth the fourth Angle; so the four Filiae arising from the Matres, do constitute the four succedent Houses; the first makes the second House, the second the eleventh, the third the eighth, and the fourth makes the first House: the rest of the Houses, which are Cadents are to be calculated according to the Rule of their triplicity; that is to say, by making the ninth out of the fourth and fifth, and the sixth out of the tenth and second, of the seventh, and eleventh the third, and of the fourth and eighth the twelfth.\n\nAnd now you have the whole Figure of true judgment constituted according to true and efficatious reasons, whereby I shall show how you shall complete it: the Figure which shall be in the first House shall give you the sign ascending, which the first Figure shows; which being done, you shall attribute their signs to the rest of their Houses, according to the order of the signs: then in every House you shall note the Planets according to the nature of the Figure: then from all these you shall build your judgment according to the signification of the Planets in the signs and Houses wherein they shall be found, and according to their aspects among themselves, and to the place of the querent and thing quesited; and you shall judge according to the natures of the signs ascending in their Houses, and according to the natures and proprieties of the Figures which they have placed in the several Houses, and according to the commisture of other Figures aspecting them:"}, {"id": "index", "titre": "Le secret de tout l’art : trouver l’Index", "fr": "L’Index de la figure, que les géomanciens ont le plus souvent établi, se trouve comme dans la figure précédente. Mais nous vous donnerons ici le secret de tout l’art, pour trouver l’Index dans la figure qui suit : comptez tous les points contenus dans les lignes des projections, et divisez-les par douze ; et ce qui reste, projetez-le depuis l’Ascendant à travers les maisons successives ; et la maison sur laquelle tombe l’unité finale, la figure qui s’y trouve vous donne un jugement compétent de la chose demandée, et cela avec les significations des jugements susdits. Mais si de part et d’autre ils sont égaux ou ambigus, alors l’Index seul vous certifiera de la chose demandée. — Il reste de la division des projections 6 points ; c’est pourquoi Jupiter en la sixième maison montre l’Index.", "note": "Point non précisé : la source ne dit pas quelle maison retenir quand le reste de la division par 12 est zéro.", "en": "The Index of the Figure which the Geomancers for the most part have made, how it is found in the former Figure.\n\nBut here we shall give you the secret of the whole Art, to find out the Index in the subsequent Figure, which is thus: that you number all the points which are contained in the lines of the projections, and this you shall divide by twelve: and that which remains project from the Ascendent by the several Houses, and upon which House there falls a final unity, that Figure gives you a competent Judgment of the thing quesited; and this together with the significations of the Judgments aforesaid. But if on either part they shall be equal, or ambiguous, then the Index alone shall certify you of the thing quesited. The Example of this Figure is here placed.\n\nThere remains out of the division of the projections 6 points; wherefore Jupiter in the 6 House shows the Index."}, {"id": "maisons", "titre": "Les significations des douze maisons", "fr": "Il reste maintenant à déclarer à quelle chose et à quelle maison appartient une question, puis ce que chaque figure montre ou signifie, sur toutes les questions, en chaque maison. Nous traiterons donc d’abord des significations des maisons, qui sont celles-ci.\n\nLa première maison montre la personne du consultant, chaque fois qu’une question est posée sur lui-même, sur ses propres affaires, ou sur quelque chose qui lui appartient. Cette maison déclare le jugement de la vie, de la forme, de l’état, de la condition, de l’habitude, de la disposition, de la forme et de la figure, et du teint des hommes. La deuxième maison contient le jugement de l’avoir, des richesses, de la pauvreté, du gain et de la perte, de la bonne et de la mauvaise fortune, et des accidents survenant à l’avoir, comme le vol, la perte ou la négligence. La troisième maison signifie les frères, les sœurs et les collatéraux par le sang ; elle juge des petits voyages et de la fidélité des hommes. La quatrième maison signifie les pères et grands-pères, le patrimoine et l’héritage, les possessions, les bâtiments, les champs, les trésors et les choses cachées ; elle donne aussi la description de ceux à qui il manque quelque chose par vol, perte ou négligence. La cinquième maison donne le jugement des légats, des messagers, des rumeurs, des nouvelles, de l’honneur et des accidents après la mort, et des questions qu’on peut poser sur les femmes enceintes ou les créatures pleines. La sixième maison donne le jugement des infirmités et des remèdes, des familiers et des serviteurs, du bétail et des animaux domestiques. La septième maison signifie le mariage, la débauche et la fornication ; elle rend le jugement des amis, des querelles et des différends, et des affaires traitées devant les juges. La huitième a signification de la mort, des choses qui viennent par la mort, des legs et des biens héréditaires, de la dot ou de la part d’une épouse. La neuvième maison montre les voyages, la foi et la constance, les songes, les sciences divines et la religion. La dixième maison a signification des honneurs et des charges de magistrature. La onzième maison signifie les amis et l’avoir des princes. La douzième maison signifie les ennemis, les serviteurs, l’emprisonnement et l’infortune, et tout le mal qui peut arriver hors la mort et la maladie, dont les jugements sont à chercher en la sixième maison et en la huitième.", "en": "It remains now, that we declare, of what thing and to what House a Question does appertain. Then, what every Figure does show or signify concerning all Questions in every House.\n\nFirst therefore we shall handle the significations of the Houses; which are these.\n\nThe first House shows the person of the Querent, as often as a Question shall be proposed concerning himself of his own matters, or any thing appertaining to him. And this House declares the Judgment of the life, form, state, condition, habit, disposition, form and figure, and of the color of men. The second House contains the Judgment of substance, riches, poverty, gain and loss, good fortune and evil fortune: and of accidents in substance; as theft, loss or negligence. The third House signifies brethren, sisters, and Collaterals in blood: It judges of small journeys, and fidelities of men. The fourth House signifies fathers and grandfathers, patrimony and inheritance, possessions, buildings, fields, treasure, and things hidden: It gives also the description of those who want any thing by theft, losing, or negligence. The fifth House gives judgment of Legates, Messengers, Rumors, News; of Honor, and of accidents after death: and of Questions that may be propounded concernning women with child, or creatures pregnant. The sixth House gives Judgment of infirmities, and medicines; of familiars and servants; of cattle and domestic animals. The seventh House signifies wedlock, whoredom, and fornica ion; renders Judgment of friends, strifes, and controversies; and of matters acted before Judges. The eighth has signification of death, and of those things which come by death of Legates, and hereditaments; of the dowry or portion of a wife. The ninth House shows journeys, faith, and constancy; dreams, divine Sciences, and Religion. The tenth House has signification of Honors, and of Magisterial Offices. The eleventh House signifies friends, and the substance of Princes. The twelfth House signifies enemies, servants, imprisonment, and misfortune, and whatsoever evil can happen besides death and sickness, the Judgments whereof are to be required in the sixth House, and in the eighth."}, {"id": "cauda", "titre": "La Queue du Dragon", "fr": "Cauda Draconis, dans toutes et chacune des maisons susdites, donne le jugement contraire à Caput. Ce sont là les natures des figures de géomancie et leurs jugements, dans toutes et chacune de leurs maisons, sur toutes sortes de questions à poser, sur ou concernant quelque matière ou chose que ce soit.", "en": "Cauda Draconis, in all and singular the respective Houses aforesaid, gives the contrary judgment to Caput. And these are the natures of the figures of Geomancy, and their judgments, in all and singular their Houses, upon all manner of Questions to be propounded, of or concerning any matter or thing whatsoever."}, {"id": "jugement", "titre": "La manière de procéder au jugement", "fr": "Dans la manière de procéder au jugement, voici ce que vous devez surtout observer : chaque fois qu’une question vous est proposée qui est contenue dans l’une des maisons, vous n’y répondrez pas seulement par la figure contenue dans cette maison ; mais, en regardant et en considérant avec soin toutes les figures, et l’Index lui-même en deux maisons, vous fonderez la face du jugement. Vous considérerez donc la figure de la chose demandée, si elle se multiplie dans les autres lieux de la figure, afin de les faire participer aussi à votre jugement : par exemple, si une question est posée sur la deuxième maison au sujet d’un voleur, et que la figure de la deuxième maison se trouve dans la sixième, cela déclare que le voleur est quelqu’un de la maisonnée ou des serviteurs ; et c’est de cette manière que vous jugerez et considérerez le reste ; car tout cet art consiste dans les mélanges des figures et leurs natures ; et quiconque le pratique correctement déclarera toujours des jugements très vrais et certains sur chaque chose particulière, quelle qu’elle soit.", "en": "But now in the manner of proceeding to judgment, this you are especially to observe; That whenever any Question shall be proposed to you, which is contained in any of the Houses, that you shall not only answer thereunto by the figure contained in such a House; but beholding and diligently respecting all the figures, and the Index it self in two Houses, you shall ground the face of judgment. You shall therefore consider the figure of the thing quesited or enquired after, if he shall multiply himself by the other places of the figure, that you may cause them also to be partakers in your judgment: as for example, if a Question shall be propounded of the second House concerning a thief, and the figure of the second House shall be found in the sixth, it declares the thief to be some of ones own household or servants: and after this manner shall you judge and consider of the rest; for this whole Art consists in the Commixtures of the figures, and the natures thereof; which whosoever does rightly practice, he shall always declare most true and certain judgments upon every particular thing whatsoever."}];

 symbole:"Adama, l’ancêtre des hommes, symbolise la chance : de son union avec Awa, la première femme créée, il engendra l’humanité. Procréer, c’est prospérer et croître ; avoir des enfants, c’est être riche, car la descendance est la plus grande richesse qu’un homme puisse espérer. Quand une femme est enceinte, on dit « ka hardiegela » : elle a eu de la chance. La maison de la chance symbolise les biens humains et matériels qui entrent dans la famille.",
 symbolePages:"p. 553",
 autres:[["p. 587","Selon D. Pâques (1954), cité par Kassibo, deux signes géomantiques, Adama et Jamati Moussa, proviendraient de la dislocation des branches du banan (arbre de la cosmogonie bambara) : le premier représenterait Dieu et six ancêtres, le second huit ancêtres ; ils auraient donné naissance à tous les autres signes, et leur combinaison révélerait à l’homme son destin."]]},

 saraka:"Du lait ou du dégê, ou sept noix de cola de type kaba woro (même signification que le dakabana), à jeter à l’eau ou à offrir, soit à un aveugle, soit à un lépreux. N’gansa symbolise la douleur, la maladie, l’affliction ; d’après Kaïtina, le lépreux et l’aveugle sont des personnes qui hébergent la maladie toute leur vie sans pouvoir s’en défaire.",
 symbole:"N’gansa est la maison de la maladie et de la souffrance. Chez Ez Zenati, la maison porte le nom du prophète Issa et symbolise la maladie et les esclaves ; la figure garde son sens étymologique arabe, kabula haraji, « la poignée entrante » (traduction telle qu’imprimée). En astrologie, c’est la maison des servitudes. La figure est aussi appelée Issa ou Kalazan selon les systèmes. Pour Kaïtina, du Korondugu, N’gansa n’est autre que Yuba, c’est-à-dire Job : il tomba malade, dit-on, pendant soixante ans et incarne la souffrance. Il fut guéri grâce au fruit du tamarinier, qu’on lui faisait boire en infusion ; les graines jetées après usage germèrent et donnèrent d’autres arbres, grâce auxquels il guérit. Job personnifie la patience, la résignation devant l’adversité : il est esclave de la douleur.",

 kaitina:{couleur:"rouge", jourNuit:"diurne", sexe:"femelle", jour:"samedi", element:"air", orient:"occidentale"},
 saraka:"Du zira mugu (pain de singe), qu’on dépose dans un morceau de calebasse brisée. On y trace la figure Lumara et on l’expose à l’air, qui « la mange » petit à petit en la dispersant.",
 symbole:"C’est la maison du mariage chez Ez Zenati et dans les systèmes soudaniens ; en astrologie, elle est qualifiée de maison des adversaires. La figure est Al humura ou El omr, « la rougeur » en arabe, devenue Lumara, Lomara ou Oumarou dans la zone soudanienne. Selon Kaïtina, Lumara naquit dans la famille de son oncle maternel, qui avait trois filles ; il était le gendre idéal par sa conduite exemplaire. Il épousa l’aînée de ses cousines, qui lui donna des jumeaux et mourut ; on remplaça la défunte par sa servante, qui accoucha à son tour de jumeaux et mourut. Il épousa la deuxième cousine, qui eut des jumeaux avant de mourir ; la servante de celle-ci et la troisième cousine connurent exactement le même sort. Il épousa enfin, en sixièmes noces, la servante de la troisième cousine : elle aussi accoucha de jumeaux, mais survécut, et devint la mère des douze enfants de son mari, qui seraient, dit-on, à l’origine des funèw (bardes religieux regroupés en caste dans l’aire mandé).",
 symbolePages:"p. 555",

 saraka:"Tout ce qui est noir, depuis les camelins jusqu’aux ovins, caprins et poulets noirs ; un sachet noir rempli de cendre ou de poudre de fusil, de charbon ou de crottes d’âne, ou encore du chiffon noir ; la noix de cola du genre kaba woro finman (avec des points noirs).",
 symbole:"Almankusu, « le renversé » en arabe (Al Mangoussi chez Ez Zenati), symbolise dans tous les systèmes la mort ; chez Ez Zenati, la maison s’appelle Ayouba. Selon la version attribuée à cette figure, Mangoussi, ou Idrissa, a pour équivalent Jonas : il fut avalé par un gros poisson et séjourna longtemps dans son ventre, dans une totale obscurité, jusqu’à ce que Dieu somme le poisson de le délivrer. Une autre fois, pendant qu’on creusait la tombe d’un défunt, Nabilaï Idrissa (le prophète Idriss), voulant savoir si les dimensions étaient correctes, s’étendit dans la tombe et refusa d’en sortir, y trouvant la fraîcheur du paradis ; on se résolut à l’enterrer selon ses vœux. Al Mangoussi représente donc la mort, l’obscurité (dibi) où se trament tous les complots ; c’est le domaine des choses cachées, de la connaissance noire redoutée de tous ; c’est le symbole de la sournoiserie et de la duplicité.",
 symbolePages:"p. 555-556",

 kaitina:{couleur:"blanc", jourNuit:"diurne", sexe:"mâle", jour:"mardi", element:"feu", orient:"orientale"},
 saraka:"Le chameau blanc, les bovins, ovins et caprins ou les poulets blancs. Offrir six noix de cola blanches ou du lait.",
 symbole:"En astrologie, c’est la maison de la religion ; Ez Zenati et les écoles soudaniennes en font la maison des voyages. Ez Zenati l’appelle Allah Taala ; la figure correspondante garde chez lui sa dénomination arabe, Nacrât al Kharija, « la victoire sortante ». Les écoles africaines adoptent le nom de la maison pour désigner la figure, mais on retrouve dans son symbolisme à la fois la notion de victoire et le sens religieux de l’astrologie. D’après Kaïtina, Kalalaw (ou Allahoutala, ou Kalantala) n’est autre que le prophète Mohammed, venu indiquer aux hommes la voie du salut ; les païens, ne voulant pas prononcer son nom, lui donnèrent en géomancie le surnom de Kalalaw. Le Sira so est donc la maison de la route, voie spirituelle autant que terrestre, symbolisant le voyage. Kassibo considère ces orthographes comme des déformations de l’arabe Allah Taala.",
 symbolePages:"p. 556",
 autres:[]},
{ // 10 Carcer
 kaitina:{couleur:"non précisé par la source", jourNuit:"diurne", sexe:"femelle", jour:"vendredi", element:"terre", orient:"septentrionale"},
 saraka:"L’œuf entre dans ses préférences, ou la poule pondeuse (avec des œufs dans son ventre si possible) ; on peut lui offrir la mansaya woro (noix de cola royale), ou les poumons d’un animal.",
 symbole:"C’est la maison de la royauté, de la puissance publique, des honneurs. La figure qui lui est rattachée est Ackaf et thaqâfa, « l’intelligence, l’instruction », dans la géomancie traditionnelle arabe. Ez Zenati attribue à la maison le nom de Souleymani ; les systèmes africains rattachent ce nom à la figure : Mansa Souleymani chez les Banmanan (Travélé), Mansa Solomani au Korondugu (Kaïtina). Chez Fily Dabo Sissoko elle devient Térémessé dit Diamfa Alamamy, et au Bélédougou elle garde le nom de Térémessé. Selon Kassibo, Sissoko se trompe en la confondant avec Janfa Almami, puisque la puissance publique est représentée, selon la légende, par le roi Salomon. Selon Kaïtina, Mansa Solomani, fils de Daouda (David), s’est vu attribuer par Dieu la maîtrise de toutes les créatures, même des génies ; sur un simple ordre il pouvait faire agir n’importe quelle force. Il représente le roi merveilleux, omniscient et omnipotent, dans la conscience populaire ouest-africaine ; il apparaît partout comme l’incarnation du pouvoir.",
 symbolePages:"p. 556-557",
 autres:[]},
